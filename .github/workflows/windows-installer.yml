# Установщик игры для Windows: собирается и проверяется на настоящем Windows.
# Готовый Gorodok-Setup-<версия>.exe — в артефактах запуска (Actions → запуск → Artifacts).
name: Установщик для Windows
on:
  push:
    paths: ['desktop/**', 'prototypes/**', '.github/workflows/windows-installer.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: NSIS
        shell: pwsh
        run: if (-not (Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) { choco install nsis -y --no-progress }
      - name: Сборка установщика
        run: npm run installer
      - name: Проверка приложения (запуск, сохранения, старое сохранение)
        run: node scripts/smoke.cjs --packaged
      - uses: actions/upload-artifact@v4
        with:
          name: Gorodok-Setup
          path: desktop/dist/Gorodok-Setup-*.exe
          if-no-files-found: error
