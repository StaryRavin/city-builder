<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Участки на перекрёстке</title>
<style>
  :root { color-scheme: light dark; --bg:#fafaf7; --fg:#1d1d1b; --muted:#6a6a64; --btn:#ecebe4; --btn-b:#cfcdc2; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#1b1b19; --fg:#ecece6; --muted:#9a9a92; --btn:#2a2a27; --btn-b:#44443f; } }
  :root[data-theme="dark"] { --bg:#1b1b19; --fg:#ecece6; --muted:#9a9a92; --btn:#2a2a27; --btn-b:#44443f; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, sans-serif; }
  main { max-width:720px; margin:0 auto; }
  .row { display:flex; align-items:center; gap:12px; padding:0.35rem 0; font-size:14px; }
  .row label { min-width:150px; }
  .row input { flex:1; min-width:0; }
  .row output { min-width:48px; text-align:right; font-variant-numeric:tabular-nums; }
  .hint { color:var(--muted); font-size:13px; justify-content:space-between; }
  button { font:inherit; font-size:13px; color:var(--fg); background:var(--btn); border:1px solid var(--btn-b); border-radius:6px; padding:4px 12px; cursor:pointer; white-space:nowrap; }
  svg { width:100%; height:auto; display:block; touch-action:none; user-select:none; -webkit-user-select:none; }
  #world polygon, #world line { vector-effect:non-scaling-stroke; }
  .legend text { font-size:12px; fill:var(--muted); }
  #st { font-size:13px; color:var(--muted); margin:4px 0 0; min-height:1.5em; }
  @media (max-width:480px) { .row label { min-width:110px; } }
</style>
</head>
<body>
<main>
<div class="row">
  <label for="ang">Угол между дорогами</label>
  <input id="ang" type="range" min="20" max="90" value="60" step="1">
  <output id="angv">60°</output>
</div>
<div class="row hint">
  <span>Зажмите клетку у улицы и тяните — выделится участок. Тап по участку удаляет его.</span>
  <button id="clr" type="button">Очистить</button>
</div>
<svg id="sv" viewBox="0 0 680 450" role="img" aria-label="Перекрёсток под углом: выделение участков по клеткам">
<defs><clipPath id="fr"><rect x="40" y="30" width="600" height="360" rx="4"/></clipPath></defs>
<rect x="40" y="30" width="600" height="360" rx="4" fill="#E6E0CC"/>
<g clip-path="url(#fr)"><g id="world"><g id="cells"></g><g id="roads"></g><g id="bis"></g><g id="lots"></g><g id="sel"></g></g></g>
<g class="legend">
<rect x="40" y="404" width="14" height="14" fill="#9ED38F" stroke="#6FA862" stroke-width="0.6"/><text x="60" y="416">Клетка зоны</text>
<rect x="160" y="404" width="14" height="14" fill="#F2B866" stroke="#B27A24" stroke-width="0.6"/><text x="180" y="416">Угловая клетка</text>
<line x1="300" y1="411" x2="324" y2="411" stroke="#8A5A1A" stroke-width="1.2" stroke-dasharray="4 3"/><text x="330" y="416">Биссектриса</text>
<rect x="40" y="428" width="14" height="14" fill="#C8553D" stroke="#6E2414" stroke-width="0.8"/><text x="60" y="440">Участок</text>
<rect x="160" y="428" width="14" height="14" fill="#3E9B5B" fill-opacity="0.55" stroke="#1F6B38" stroke-width="1.2"/><text x="180" y="440">Можно построить</text>
<rect x="300" y="428" width="14" height="14" fill="#D9363E" fill-opacity="0.55" stroke="#8E1B21" stroke-width="1.2"/><text x="320" y="440">Нельзя: задевает улицу или участок</text>
</g>
</svg>
<p id="st"></p>
</main>

<script>
/*
 * Две дороги ширины 2W пересекаются в точке (CX, CY) под углом deg.
 * У каждой стороны каждой улицы (в каждом из четырёх кварталов) своя сетка
 * клеток размера s глубиной D, ориентированная по улице. Фоном показано
 * зонирование: клетка принадлежит ближайшей улице, граница — биссектриса.
 *
 * Участки выделяются мышью/пальцем по сетке одной улицы:
 * - сетка выбирается по клетке, в которой начато выделение (по ту сторону
 *   биссектрисы, к какой улице клетка ближе);
 * - участок — прямоугольник в координатах этой сетки, всегда от улицы
 *   (глубина 0..j1), по колонкам — между начальной и текущей клеткой;
 * - за биссектрису участок заходить может, это не запрещено;
 * - участок невалиден, если хотя бы частично заходит на любую дорогу
 *   (касание кромки допускается) или пересекается с другим участком.
 * Участки хранятся в координатах сетки (квартал, улица, колонки, глубина),
 * поэтому при смене угла они остаются на месте и перепроверяются.
 */
(function(){
var s=20,D=4,N=48,CX=340,CY=210,W=20,EPS=0.5;
function add(a,b){return [a[0]+b[0],a[1]+b[1]]}
function sub(a,b){return [a[0]-b[0],a[1]-b[1]]}
function mul(a,k){return [a[0]*k,a[1]*k]}
function dot(a,b){return a[0]*b[0]+a[1]*b[1]}
function nrm(a){var l=Math.hypot(a[0],a[1]);return [a[0]/l,a[1]/l]}
function cr(a,b){return a[0]*b[1]-a[1]*b[0]}
function area(p){var a=0;for(var i=0;i<p.length;i++){var q=p[(i+1)%p.length];a+=p[i][0]*q[1]-q[0]*p[i][1]}return Math.abs(a)/2}
function clip(poly,K,m,sg){
var out=[];
for(var i=0;i<poly.length;i++){
var a=poly[i],b=poly[(i+1)%poly.length];
var ga=sg*cr(m,sub(a,K)),gb=sg*cr(m,sub(b,K));
if(ga>=0)out.push(a);
if((ga>=0)!==(gb>=0)){var t=ga/(ga-gb);out.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]);}
}
return out;
}
function pts(p){return p.map(function(q){return q[0].toFixed(1)+','+q[1].toFixed(1)}).join(' ')}
function proj(poly,ax){var lo=Infinity,hi=-Infinity;poly.forEach(function(p){var v=dot(p,ax);if(v<lo)lo=v;if(v>hi)hi=v});return [lo,hi]}
// выпуклые многоугольники перекрываются по площади (касание не считается)
function overlaps(P,Q){
var polys=[P,Q];
for(var t=0;t<2;t++){var R=polys[t];
for(var i=0;i<R.length;i++){var e=sub(R[(i+1)%R.length],R[i]),ax=nrm([-e[1],e[0]]);
var a=proj(P,ax),b=proj(Q,ax);
if(a[1]<=b[0]+EPS||b[1]<=a[0]+EPS)return false;}}
return true;
}
function inside(P,poly){
var sgn=0;
for(var i=0;i<poly.length;i++){var c=cr(sub(poly[(i+1)%poly.length],poly[i]),sub(P,poly[i]));
if(c!==0){if(sgn===0)sgn=Math.sign(c);else if(Math.sign(c)!==sgn)return false;}}
return true;
}

var G,k=1,FR,lots=[],drag=null;

function build(deg){
var th=deg*Math.PI/180,sn=Math.sin(th),cs=Math.cos(th);
function onLine(P,y){var t=(P[1]-y)/sn;return [P[0]+t*cs,y]}
var PR=[CX+W*sn,CY+W*cs],PL=[CX-W*sn,CY-W*cs];
var yU=CY-W,yD=CY+W;
var quads=[
{K:onLine(PR,yU),da:[1,0],db:[cs,-sn]},
{K:onLine(PL,yU),da:[-1,0],db:[cs,-sn]},
{K:onLine(PL,yD),da:[-1,0],db:[-cs,sn]},
{K:onLine(PR,yD),da:[1,0],db:[-cs,sn]}
];
quads.forEach(function(q){
var da=q.da,db=q.db,K=q.K;
q.m=nrm(add(da,db));
var dAB=dot(da,db);
q.alpha=Math.acos(dAB);
var nA=nrm([db[0]-da[0]*dAB,db[1]-da[1]*dAB]);
var nB=nrm([da[0]-db[0]*dAB,da[1]-db[1]*dAB]);
q.strips=[[da,nA],[db,nB]].map(function(st){
var d=st[0],n=st[1],sg=Math.sign(cr(q.m,d)),cells=[];
for(var i=0;i<N;i++)for(var j=0;j<D;j++){
var p0=add(K,add(mul(d,i*s),mul(n,j*s)));
var p1=add(p0,mul(d,s)),p2=add(p1,mul(n,s)),p3=add(p0,mul(n,s));
var c=clip([p0,p1,p2,p3],K,q.m,sg);
if(c.length<3)continue;
var ar=area(c);
if(ar<1)continue;
cells.push({poly:c,kind:ar<s*s-0.5?'corner':'full'});
}
return {K:K,d:d,n:n,sg:sg,m:q.m,cells:cells};
});
});
// дороги как полосы: проекция на нормаль ν лежит в [a, b]
var nu=[sn,cs];
var roads=[{nu:[0,1],a:CY-W,b:CY+W},{nu:nu,a:Math.min(dot(PL,nu),dot(PR,nu)),b:Math.max(dot(PL,nu),dot(PR,nu))}];
return {quads:quads,roads:roads,sn:sn,cs:cs,PR:PR,PL:PL};
}

function lotPoly(l){
var st=G.quads[l.q].strips[l.si];
var p0=add(st.K,mul(st.d,l.i0*s)),w=(l.i1-l.i0+1)*s,h=(l.j1+1)*s;
var p1=add(p0,mul(st.d,w));
return [p0,p1,add(p1,mul(st.n,h)),add(p0,mul(st.n,h))];
}
// причина невалидности участка или null
function check(l,skip){
var P=lotPoly(l);
for(var r=0;r<G.roads.length;r++){var R=G.roads[r],pr=proj(P,R.nu);
if(pr[1]>R.a+EPS&&pr[0]<R.b-EPS)return 'road';}
for(var i=0;i<lots.length;i++){if(lots[i]===skip)continue;if(overlaps(P,lotPoly(lots[i])))return 'lot';}
return null;
}

// клетка под точкой: сетка той улицы, к которой точка ближе
function hit(P){
for(var q=0;q<4;q++)for(var si=0;si<2;si++){
var st=G.quads[q].strips[si],v=sub(P,st.K),u=dot(v,st.d)/s,w=dot(v,st.n)/s;
if(u>=0&&u<N&&w>=0&&w<D&&st.sg*cr(st.m,v)>=0)return {q:q,si:si,i:Math.floor(u),j:Math.floor(w)};
}
return null;
}
function local(P,q,si){
var st=G.quads[q].strips[si],v=sub(P,st.K);
return {i:Math.max(0,Math.min(N-1,Math.floor(dot(v,st.d)/s))),j:Math.max(0,Math.min(D-1,Math.floor(dot(v,st.n)/s)))};
}
function selLot(){
if(!drag)return null;
return {q:drag.q,si:drag.si,i0:Math.min(drag.i,drag.ci),i1:Math.max(drag.i,drag.ci),j1:Math.max(drag.j,drag.cj)};
}

function lotSvg(l,fill,stroke,op,sw){
var P=lotPoly(l),st=G.quads[l.q].strips[l.si],out='<g>';
out+='<polygon points="'+pts(P)+'" fill="'+fill+'" fill-opacity="'+op+'" stroke="'+stroke+'" stroke-width="'+sw+'"/>';
// внутренняя сетка участка
var h=(l.j1+1)*s,w=(l.i1-l.i0+1)*s;
for(var i=1;i<=l.i1-l.i0;i++){var a=add(P[0],mul(st.d,i*s)),b=add(a,mul(st.n,h));
out+='<line x1="'+a[0].toFixed(1)+'" y1="'+a[1].toFixed(1)+'" x2="'+b[0].toFixed(1)+'" y2="'+b[1].toFixed(1)+'" stroke="'+stroke+'" stroke-width="0.5" stroke-opacity="0.6"/>';}
for(var j=1;j<=l.j1;j++){var a2=add(P[0],mul(st.n,j*s)),b2=add(a2,mul(st.d,w));
out+='<line x1="'+a2[0].toFixed(1)+'" y1="'+a2[1].toFixed(1)+'" x2="'+b2[0].toFixed(1)+'" y2="'+b2[1].toFixed(1)+'" stroke="'+stroke+'" stroke-width="0.5" stroke-opacity="0.6"/>';}
var c=mul(add(P[0],P[2]),0.5);
out+='<text x="'+c[0].toFixed(1)+'" y="'+c[1].toFixed(1)+'" font-size="'+(11/k).toFixed(1)+'" text-anchor="middle" dominant-baseline="central" fill="#fff" style="pointer-events:none;font-weight:600">'+(l.i1-l.i0+1)+'×'+(l.j1+1)+'</text>';
return out+'</g>';
}

var stEl=document.getElementById('st');
var REASON={road:'нельзя — задевает улицу',lot:'нельзя — пересекается с другим участком'};
function status(){
if(drag&&drag.moved!==undefined){
var l=selLot(),why=check(l,null);
stEl.textContent='Участок '+(l.i1-l.i0+1)+'×'+(l.j1+1)+': '+(why?REASON[why]:'можно построить');
return;
}
var bad=lots.filter(function(l){return check(l,l)}).length;
stEl.textContent='Участков: '+lots.length+(bad?', из них невалидных после смены угла: '+bad:'')+'.';
}
function drawLots(){
var out='';
lots.forEach(function(l){var bad=check(l,l);
out+=bad?lotSvg(l,'#D9363E','#8E1B21',0.75,1):lotSvg(l,'#C8553D','#6E2414',1,1);});
document.getElementById('lots').innerHTML=out;
}
function drawSel(){
var l=selLot(),out='';
if(l){var bad=check(l,null);out=bad?lotSvg(l,'#D9363E','#8E1B21',0.55,1.6):lotSvg(l,'#3E9B5B','#1F6B38',0.55,1.6);}
document.getElementById('sel').innerHTML=out;
status();
}

var angEl=document.getElementById('ang');
function render(){
var deg=parseInt(angEl.value,10);
G=build(deg);
var sn=G.sn,cs=G.cs,PR=G.PR,PL=G.PL,quads=G.quads;
// отдаляем сцену при острых углах, чтобы был виден весь срезанный треугольник у угла
var Lc=D*s/Math.tan(deg*Math.PI/360);
k=Math.min(1,260/(Lc+6*s));
FR={x0:CX-(CX-40)/k,y0:CY-(CY-30)/k,x1:CX+(640-CX)/k,y1:CY+(390-CY)/k};
document.getElementById('world').setAttribute('transform','translate('+CX+' '+CY+') scale('+k.toFixed(3)+') translate('+(-CX)+' '+(-CY)+')');
var cells='',bis='';
var COL={full:['#9ED38F','#6FA862'],corner:['#F2B866','#B27A24']};
quads.forEach(function(q){
q.strips.forEach(function(st){st.cells.forEach(function(c){var col=COL[c.kind];
cells+='<polygon points="'+pts(c.poly)+'" fill="'+col[0]+'" stroke="'+col[1]+'" stroke-width="0.6"/>';})});
var L=D*s/Math.sin(q.alpha/2),e=add(q.K,mul(q.m,L));
bis+='<line x1="'+q.K[0].toFixed(1)+'" y1="'+q.K[1].toFixed(1)+'" x2="'+e[0].toFixed(1)+'" y2="'+e[1].toFixed(1)+'" stroke="#8A5A1A" stroke-width="1.2" stroke-dasharray="4 3"/>';
});
function xAt(P,y){return P[0]+(P[1]-y)/sn*cs}
var y0=FR.y0,y1=FR.y1;
var roads='<rect x="'+FR.x0.toFixed(1)+'" y="'+(CY-W)+'" width="'+(FR.x1-FR.x0).toFixed(1)+'" height="'+(2*W)+'" fill="#5A5F66"/>';
roads+='<polygon points="'+pts([[xAt(PL,y0),y0],[xAt(PR,y0),y0],[xAt(PR,y1),y1],[xAt(PL,y1),y1]])+'" fill="#5A5F66"/>';
var cxa=CX+(CY-y0)/sn*cs,cxb=CX+(CY-y1)/sn*cs;
roads+='<g stroke="#F2F2F2" stroke-width="2" stroke-dasharray="12 10" fill="none"><line x1="'+FR.x0.toFixed(1)+'" y1="'+CY+'" x2="'+FR.x1.toFixed(1)+'" y2="'+CY+'"/><line x1="'+cxa.toFixed(1)+'" y1="'+y0.toFixed(1)+'" x2="'+cxb.toFixed(1)+'" y2="'+y1.toFixed(1)+'"/></g>';
roads+='<polygon points="'+pts([quads[1].K,quads[0].K,quads[3].K,quads[2].K])+'" fill="#5A5F66"/>';
document.getElementById('cells').innerHTML=cells;
document.getElementById('roads').innerHTML=roads;
document.getElementById('bis').innerHTML=bis;
document.getElementById('angv').textContent=deg+'°';
drawLots();drawSel();
}

// ввод: мышь и палец
var sv=document.getElementById('sv');
function worldPt(e){
var pt=sv.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;
var p=pt.matrixTransform(sv.getScreenCTM().inverse());
return [CX+(p.x-CX)/k,CY+(p.y-CY)/k];
}
sv.addEventListener('pointerdown',function(e){
var P=worldPt(e),onLot=-1;
for(var i=lots.length-1;i>=0;i--)if(inside(P,lotPoly(lots[i]))){onLot=i;break}
var h=hit(P);
if(!h&&onLot<0)return;
e.preventDefault();
try{sv.setPointerCapture(e.pointerId)}catch(_){}
drag=h?{q:h.q,si:h.si,i:h.i,j:h.j,ci:h.i,cj:h.j,moved:false,onLot:onLot}:{onLot:onLot,none:true};
if(!drag.none)drawSel();
});
sv.addEventListener('pointermove',function(e){
if(!drag||drag.none)return;
var c=local(worldPt(e),drag.q,drag.si);
if(c.i!==drag.ci||c.j!==drag.cj){drag.ci=c.i;drag.cj=c.j;drag.moved=true;drawSel();}
});
function finish(){
if(!drag)return;
var d=drag;drag=null;
if(!d.moved&&d.onLot>=0){lots.splice(d.onLot,1);}
else if(!d.none){
drag=d;var l=selLot();drag=null;
if(!check(l,null))lots.push(l);
}
document.getElementById('sel').innerHTML='';
drawLots();status();
}
sv.addEventListener('pointerup',finish);
sv.addEventListener('pointercancel',function(){drag=null;document.getElementById('sel').innerHTML='';status();});
document.getElementById('clr').addEventListener('click',function(){lots=[];drawLots();status();});
angEl.addEventListener('input',render);
render();
// отладка: список участков и экранные координаты центра клетки
window.__lots=function(){return lots.map(function(l){return Object.assign({bad:check(l,l)},l)})};
window.__cell=function(q,si,i,j){
var st=G.quads[q].strips[si],P=add(st.K,add(mul(st.d,(i+0.5)*s),mul(st.n,(j+0.5)*s)));
var pt=sv.createSVGPoint();pt.x=CX+(P[0]-CX)*k;pt.y=CY+(P[1]-CY)*k;
var r=pt.matrixTransform(sv.getScreenCTM());return [r.x,r.y];
};
})();
</script>
</body>
</html>
