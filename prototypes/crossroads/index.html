<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Перекрёсток под углом</title>
<style>
  :root { color-scheme: light dark; --bg:#fafaf7; --fg:#1d1d1b; --muted:#6a6a64; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#1b1b19; --fg:#ecece6; --muted:#9a9a92; } }
  :root[data-theme="dark"] { --bg:#1b1b19; --fg:#ecece6; --muted:#9a9a92; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, sans-serif; }
  main { max-width:720px; margin:0 auto; }
  .row { display:flex; align-items:center; gap:12px; padding:0.35rem 0; font-size:14px; }
  .row label { min-width:150px; }
  .row input { flex:1; min-width:0; }
  .row output { min-width:48px; text-align:right; font-variant-numeric:tabular-nums; }
  svg { width:100%; height:auto; display:block; }
  .legend text { font-size:12px; fill:var(--muted); }
  #world polygon, #world line { vector-effect:non-scaling-stroke; }
  #st { font-size:13px; color:var(--muted); margin:4px 0 0; }
  @media (max-width:480px) { .row label { min-width:110px; } }
</style>
</head>
<body>
<main>
<div class="row">
  <label for="ang">Угол между дорогами</label>
  <input id="ang" type="range" min="20" max="90" value="60" step="1">
  <output id="angv">60°</output>
</div>
<div class="row">
  <label for="pos">Положение дома</label>
  <input id="pos" type="range" min="-6" max="10" value="0" step="1">
  <output id="posv">0</output>
</div>
<svg id="sv" viewBox="0 0 680 450" role="img" aria-label="Перекрёсток под углом с клетками зонирования и домом">
<defs><clipPath id="fr"><rect x="40" y="30" width="600" height="360" rx="4"/></clipPath></defs>
<rect x="40" y="30" width="600" height="360" rx="4" fill="#E6E0CC"/>
<g clip-path="url(#fr)"><g id="world"><g id="cells"></g><g id="roads"></g><g id="house"></g><g id="bis"></g></g></g>
<g class="legend">
<rect x="40" y="404" width="14" height="14" fill="#9ED38F" stroke="#6FA862" stroke-width="0.6"/><text x="60" y="416">Обычная клетка</text>
<rect x="170" y="404" width="14" height="14" fill="#F2B866" stroke="#B27A24" stroke-width="0.6"/><text x="190" y="416">Угловая клетка</text>
<rect x="300" y="404" width="14" height="14" fill="#F7E2BA" stroke="#B27A24" stroke-width="0.6"/><text x="320" y="416">Мелкий обрезок</text>
<line x1="430" y1="411" x2="454" y2="411" stroke="#8A5A1A" stroke-width="1.2" stroke-dasharray="4 3"/><text x="460" y="416">Биссектриса</text>
<rect x="40" y="428" width="14" height="14" fill="#C8553D" stroke="#6E2414" stroke-width="0.8"/><text x="60" y="440">Дом</text>
<rect x="170" y="428" width="14" height="14" fill="#E9967A" stroke="#6E2414" stroke-width="0.8"/><text x="190" y="440">Угловой дом</text>
</g>
</svg>
<p id="st"></p>
</main>

<script>
/*
 * Две дороги ширины 2W пересекаются в точке (CX, CY) под углом deg.
 * Для каждого из четырёх углов (квадрантов) строим клетки размера s вдоль двух кромок:
 * клетка принадлежит той дороге, до которой ближе (граница = биссектриса угла),
 * сетка клеток перпендикулярна своей дороге, глубина зоны D клеток.
 * Клетки у биссектрисы обрезаются (угловые), совсем мелкие помечаются как обрезки.
 *
 * Дом H×H клеток ставится в правом верхнем квартале. Вдали от перекрёстка он
 * занимает ровно H×H целых клеток. На самом углу стоит угловой дом, симметричный
 * относительно биссектрисы (см. cornerHouse и placeHouse).
 */
(function(){
var s=20,D=4,N=48,CX=340,CY=210,W=20,H=4;
var FR;
// масштаб сцены: k < 1 — отдаляем, рамка в мировых координатах становится больше
function setZoom(k){FR={x0:CX-(CX-40)/k,y0:CY-(CY-30)/k,x1:CX+(640-CX)/k,y1:CY+(390-CY)/k}}
function add(a,b){return [a[0]+b[0],a[1]+b[1]]}
function sub(a,b){return [a[0]-b[0],a[1]-b[1]]}
function mul(a,k){return [a[0]*k,a[1]*k]}
function dot(a,b){return a[0]*b[0]+a[1]*b[1]}
function nrm(a){var l=Math.hypot(a[0],a[1]);return [a[0]/l,a[1]/l]}
function cr(a,b){return a[0]*b[1]-a[1]*b[0]}
function area(p){var a=0;for(var i=0;i<p.length;i++){var q=p[(i+1)%p.length];a+=p[i][0]*q[1]-q[0]*p[i][1]}return Math.abs(a)/2}
// отсечение выпуклого многоугольника полуплоскостью по одну сторону биссектрисы (луч из K в направлении m)
function clip(poly,K,m,sg){
var out=[];
for(var i=0;i<poly.length;i++){
var a=poly[i],b=poly[(i+1)%poly.length];
var ga=sg*cr(m,sub(a,K)),gb=sg*cr(m,sub(b,K));
if(ga>=0)out.push(a);
if((ga>=0)!==(gb>=0)){var t=ga/(ga-gb);out.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]);}
}
return out;
}
function pts(p){return p.map(function(q){return q[0].toFixed(1)+','+q[1].toFixed(1)}).join(' ')}
function inFrame(p){return p[0]>=FR.x0-0.01&&p[0]<=FR.x1+0.01&&p[1]>=FR.y0-0.01&&p[1]<=FR.y1+0.01}

// Геометрия перекрёстка: кварталы, полосы, клетки
function build(deg){
var th=deg*Math.PI/180,sn=Math.sin(th),cs=Math.cos(th);
function onLine(P,y){var t=(P[1]-y)/sn;return [P[0]+t*cs,y]}
var PR=[CX+W*sn,CY+W*cs],PL=[CX-W*sn,CY-W*cs];
var yU=CY-W,yD=CY+W;
// четыре угла перекрёстка: K = вершина, da вдоль горизонтальной дороги, db вдоль наклонной
var quads=[
{K:onLine(PR,yU),da:[1,0],db:[cs,-sn]},
{K:onLine(PL,yU),da:[-1,0],db:[cs,-sn]},
{K:onLine(PL,yD),da:[-1,0],db:[-cs,sn]},
{K:onLine(PR,yD),da:[1,0],db:[-cs,sn]}
];
quads.forEach(function(q){
var da=q.da,db=q.db,K=q.K;
q.m=nrm(add(da,db));                           // биссектриса угла
var dAB=dot(da,db);
q.alpha=Math.acos(dAB);
var nA=nrm([db[0]-da[0]*dAB,db[1]-da[1]*dAB]); // внутрь квартала от дороги A
var nB=nrm([da[0]-db[0]*dAB,da[1]-db[1]*dAB]); // внутрь квартала от дороги B
q.strips=[[da,nA],[db,nB]].map(function(st,si){
var d=st[0],n=st[1],sg=Math.sign(cr(q.m,d)),cells=[],map={};
for(var i=0;i<N;i++){for(var j=0;j<D;j++){
var p0=add(K,add(mul(d,i*s),mul(n,j*s)));
var p1=add(p0,mul(d,s)),p2=add(p1,mul(n,s)),p3=add(p0,mul(n,s));
var c=clip([p0,p1,p2,p3],K,q.m,sg);
if(c.length<3)continue;
var ar=area(c);
if(ar<1)continue;
var cell={st:si,i:i,j:j,poly:c,area:ar,kind:ar<0.3*s*s?'sliver':(ar<s*s-0.5?'corner':'full')};
cells.push(cell);map[i+','+j]=cell;
}}
return {d:d,n:n,cells:cells,get:function(i,j){return map[i+','+j]}};
});
});
return {quads:quads,sn:sn,cs:cs,PR:PR,PL:PL};
}

// сколько позиций дома помещается на полосе внутри рамки
function maxPos(q,st){
var k=0;
for(var i0=0;i0<N-H;i0++){
var a=add(q.K,mul(st.d,i0*s)),b=add(a,mul(st.d,H*s));
if(!inFrame(a)||!inFrame(b)||!inFrame(add(a,mul(st.n,H*s)))||!inFrame(add(b,mul(st.n,H*s))))break;
k=i0;
}
return k;
}

// первая колонка после углового дома, с которой обычный дом H×H целиком из целых клеток
function firstFull(st,L){
for(var i0=L;i0<N-H;i0++){var ok=true;
for(var i=i0;i<i0+H&&ok;i++)for(var j=0;j<H;j++){var c=st.get(i,j);if(!c||c.kind!=='full'){ok=false;break}}
if(ok)return i0;}
return N;
}

/*
 * Угловой дом: по L колонок вдоль каждой из двух улиц, на всю глубину H.
 * Полосы обеих улиц зеркальны относительно биссектрисы, поэтому фигура
 * всегда симметрична. L подбирается так, чтобы площадь была ближе всего
 * к площади обычного дома H²·s² (при равенстве — меньший L).
 */
function cornerHouse(q){
var target=H*H*s*s,best=null;
for(var L=1;L<=N;L++){
var cells=[],ar=0;
q.strips.forEach(function(st){st.cells.forEach(function(c){if(c.i<L&&c.j<H){cells.push(c);ar+=c.area}})});
if(!best||Math.abs(ar-target)<Math.abs(best.area-target))best={L:L,cells:cells,area:ar};
if(ar>target)break;
}
best.target=target;best.corner=true;
return best;
}

/*
 * Размещение дома по ползунку.
 * pos = 0 — угловой дом;
 * pos > 0 — обычный дом на горизонтальной улице (полоса A);
 * pos < 0 — обычный дом на наклонной улице (полоса B).
 * Обычный дом ставится, только если все H×H его клеток целые и он не залезает
 * на колонки углового дома. Позиция ±1 — ближайшая к углу такая колонка (fA / fB),
 * дальше шаг в одну клетку. Между ±1 и 0 дом «прыгает» на угол: промежуточные
 * положения у угла просто недоступны.
 */
function placeHouse(q,pos,corner,fA,fB){
if(pos!==0){
var st=q.strips[pos>0?0:1],i0=Math.abs(pos)-1+(pos>0?fA:fB),cells=[],ok=true;
for(var i=i0;i<i0+H&&ok;i++)for(var j=0;j<H;j++){var c=st.get(i,j);if(!c||c.kind!=='full'){ok=false;break}cells.push(c)}
if(ok)return {cells:cells,area:H*H*s*s,target:H*H*s*s,corner:false,i0:i0};
}
return corner;
}

var angEl=document.getElementById('ang'),posEl=document.getElementById('pos');
function render(){
var deg=parseInt(angEl.value,10);
var g=build(deg),quads=g.quads,sn=g.sn,cs=g.cs,PR=g.PR,PL=g.PL;
var q0=quads[0];
var corner=cornerHouse(q0);
// отдаляем сцену, пока за угловым домом не поместятся хотя бы три позиции обычного дома
var fA=firstFull(q0.strips[0],corner.L),fB=firstFull(q0.strips[1],corner.L),k=1,mxA,mxB;
for(;;){setZoom(k);mxA=maxPos(q0,q0.strips[0]);mxB=maxPos(q0,q0.strips[1]);
if((mxA>=fA+2&&mxB>=fB+2)||k<0.25)break;k*=0.95;}
document.getElementById('world').setAttribute('transform','translate('+CX+' '+CY+') scale('+k.toFixed(3)+') translate('+(-CX)+' '+(-CY)+')');
// диапазон ползунка дома зависит от угла: дом должен целиком влезать в рамку
// позиции обычного дома считаются от первой допустимой колонки (все клетки целые)
var lo=-Math.max(0,mxB-fB+1),hi=Math.max(0,mxA-fA+1);
posEl.min=lo;posEl.max=hi;
var pos=Math.max(lo,Math.min(hi,parseInt(posEl.value,10)));
posEl.value=pos;
var hs=placeHouse(q0,pos,corner,fA,fB);

var cells='',bis='',nc=0,nsl=0;
var COL={full:['#9ED38F','#6FA862'],corner:['#F2B866','#B27A24'],sliver:['#F7E2BA','#B27A24']};
quads.forEach(function(q){
q.strips.forEach(function(st){st.cells.forEach(function(c){
if(c.kind==='sliver')nsl++;else if(c.kind==='corner')nc++;
var col=COL[c.kind];
cells+='<polygon points="'+pts(c.poly)+'" fill="'+col[0]+'" stroke="'+col[1]+'" stroke-width="0.6"/>';
})});
var L=D*s/Math.sin(q.alpha/2);                 // докуда биссектриса доходит до глубины зоны
var e=add(q.K,mul(q.m,L));
bis+='<line x1="'+q.K[0].toFixed(1)+'" y1="'+q.K[1].toFixed(1)+'" x2="'+e[0].toFixed(1)+'" y2="'+e[1].toFixed(1)+'" stroke="#8A5A1A" stroke-width="1.2" stroke-dasharray="4 3"/>';
});
var house='';
var hf=hs.corner?'#E9967A':'#C8553D';
hs.cells.forEach(function(c){house+='<polygon points="'+pts(c.poly)+'" fill="'+hf+'" stroke="#6E2414" stroke-width="0.8"/>'});
function xAt(P,y){return P[0]+(P[1]-y)/sn*cs}
var y0=FR.y0,y1=FR.y1;
var roads='<rect x="'+FR.x0.toFixed(1)+'" y="'+(CY-W)+'" width="'+(FR.x1-FR.x0).toFixed(1)+'" height="'+(2*W)+'" fill="#5A5F66"/>';
roads+='<polygon points="'+pts([[xAt(PL,y0),y0],[xAt(PR,y0),y0],[xAt(PR,y1),y1],[xAt(PL,y1),y1]])+'" fill="#5A5F66"/>';
var cxa=CX+(CY-y0)/sn*cs,cxb=CX+(CY-y1)/sn*cs;
roads+='<g stroke="#F2F2F2" stroke-width="2" stroke-dasharray="12 10" fill="none"><line x1="'+FR.x0.toFixed(1)+'" y1="'+CY+'" x2="'+FR.x1.toFixed(1)+'" y2="'+CY+'"/><line x1="'+cxa.toFixed(1)+'" y1="'+y0.toFixed(1)+'" x2="'+cxb.toFixed(1)+'" y2="'+y1.toFixed(1)+'"/></g>';
roads+='<polygon points="'+pts([quads[1].K,quads[0].K,quads[3].K,quads[2].K])+'" fill="#5A5F66"/>';
document.getElementById('cells').innerHTML=cells;
document.getElementById('roads').innerHTML=roads;
document.getElementById('house').innerHTML=house;
document.getElementById('bis').innerHTML=bis;
document.getElementById('angv').textContent=deg+'°';
document.getElementById('posv').textContent=pos;
var pct=Math.round(hs.area/hs.target*100);
document.getElementById('st').textContent='Угловых клеток: '+nc+', мелких обрезков: '+nsl+
(hs.corner?'. Угловой дом: по '+hs.L+' кл. вдоль каждой улицы, площадь '+pct+'% от '+H+'×'+H+'.':'. Обычный дом '+H+'×'+H+'.');
window.__house={k:k,deg:deg,pos:pos,pct:hs.area/hs.target,corner:hs.corner,L:hs.L,i0:hs.i0};
}
angEl.addEventListener('input',render);
posEl.addEventListener('input',render);
render();
})();
</script>
</body>
</html>
