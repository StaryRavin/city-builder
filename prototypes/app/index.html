<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Городок у реки</title>
<style>
  :root { color-scheme: light dark; --bg:#fafaf7; --panel:#ffffff; --fg:#1d1d1b; --muted:#6a6a64; --btn:#ecebe4; --btn-b:#cfcdc2; --on:#2f6f8f; --on-fg:#fff; --bad:#c62f36; --good:#2e7d4a; --line:#dedbd0; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#1b1b19; --panel:#24241f; --fg:#ecece6; --muted:#9a9a92; --btn:#2e2e2a; --btn-b:#46463f; --on:#4b93b8; --on-fg:#0d1418; --bad:#ff6b6b; --good:#6fcf8f; --line:#3a3a34; } }
  :root[data-theme="dark"] { --bg:#1b1b19; --panel:#24241f; --fg:#ecece6; --muted:#9a9a92; --btn:#2e2e2a; --btn-b:#46463f; --on:#4b93b8; --on-fg:#0d1418; --bad:#ff6b6b; --good:#6fcf8f; --line:#3a3a34; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--fg); font:14px/1.4 system-ui, sans-serif; display:flex; flex-direction:column; overflow:hidden; }
  button { font:inherit; font-size:13px; color:var(--fg); background:var(--btn); border:1px solid var(--btn-b); border-radius:6px; padding:4px 10px; cursor:pointer; white-space:nowrap; }
  button[aria-pressed="true"] { background:var(--on); color:var(--on-fg); border-color:var(--on); }
  button:disabled { opacity:.45; cursor:default; }
  .bad { color:var(--bad); } .good { color:var(--good); } .muted { color:var(--muted); font-size:12px; }
  #top { flex:none; display:flex; flex-wrap:wrap; align-items:center; gap:6px 16px; padding:8px 12px; border-bottom:1px solid var(--line); background:var(--panel); }
  .stat { display:flex; flex-direction:column; line-height:1.15; }
  .stat small { color:var(--muted); font-size:11px; }
  .stat b { font-size:15px; font-variant-numeric:tabular-nums; }
  #net { font-size:11px; font-variant-numeric:tabular-nums; }
  .rci { display:flex; gap:3px; align-items:flex-end; height:34px; }
  .rci div { width:14px; height:100%; background:var(--btn); border-radius:3px; position:relative; display:flex; align-items:flex-end; }
  .rci div i { display:block; width:100%; border-radius:3px; }
  .rci div span { position:absolute; bottom:-14px; left:0; right:0; text-align:center; font-size:10px; color:var(--muted); }
  .util { font-size:12px; font-variant-numeric:tabular-nums; line-height:1.3; }
  .util span.k { color:var(--muted); display:inline-block; width:44px; }
  .grp { display:flex; }
  .grp button { border-radius:0; margin-left:-1px; }
  .grp button:first-child { border-radius:6px 0 0 6px; margin-left:0; }
  .grp button:last-child { border-radius:0 6px 6px 0; }
  .sp { flex:1; }
  #main { flex:1; display:flex; min-height:0; }
  #tools { width:220px; overflow-y:auto; padding:8px; border-right:1px solid var(--line); background:var(--panel); }
  .tg { margin-bottom:10px; }
  .tgh { font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:0 0 4px 2px; }
  .tgb { display:flex; flex-wrap:wrap; gap:4px; }
  .tgb button { display:flex; align-items:center; gap:5px; padding:4px 8px; }
  .tgb button i { display:inline-block; width:10px; height:10px; border-radius:2px; border:1px solid rgba(0,0,0,.3); flex:none; }
  .tgb button small { opacity:.7; font-size:11px; }
  #stage { flex:1; position:relative; min-width:0; overflow:hidden; background:#CFC8B2; }
  #sv { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; user-select:none; -webkit-user-select:none; }
  .ns { vector-effect:non-scaling-stroke; }
  #v3d { position:absolute; inset:0; touch-action:none; background:#dfe7ea; }
  #v3d canvas { display:block; width:100% !important; height:100% !important; }
  #v3d[hidden], .grp[hidden] { display:none; }
  .float { position:absolute; display:flex; gap:6px; flex-wrap:wrap; }
  #f-tl { top:8px; left:8px; }
  #f-tr { top:8px; right:8px; }
  .float button { box-shadow:0 1px 3px rgba(0,0,0,.12); }
  #info { position:absolute; left:8px; bottom:8px; max-width:340px; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 30px 10px 12px; box-shadow:0 4px 16px rgba(0,0,0,.15); font-size:13px; }
  #info div { margin:2px 0; }
  #info-x { position:absolute; top:4px; right:4px; padding:0 7px; border:none; background:none; font-size:18px; }
  #info[hidden], #budget[hidden], #toast[hidden] { display:none; }
  #budget { position:absolute; right:8px; top:48px; width:330px; max-width:calc(100% - 16px); background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; box-shadow:0 4px 16px rgba(0,0,0,.18); }
  #budget h2 { font-size:15px; margin:0 0 6px; }
  #budget table { width:100%; border-collapse:collapse; font-size:13px; }
  #budget th { text-align:left; padding:8px 0 2px; border-bottom:1px solid var(--line); }
  #budget td { padding:3px 0; } .num { text-align:right; font-variant-numeric:tabular-nums; }
  .tax { display:block; font-size:12px; color:var(--muted); }
  .tax input { width:110px; vertical-align:middle; }
  #bud-x { position:absolute; top:6px; right:6px; border:none; background:none; font-size:18px; padding:0 7px; }
  #toast { position:absolute; left:50%; top:10px; transform:translateX(-50%); background:var(--panel); border:1px solid var(--line); border-left:4px solid var(--on); border-radius:8px; padding:8px 14px; box-shadow:0 4px 16px rgba(0,0,0,.18); max-width:min(520px, calc(100% - 24px)); font-size:13px; z-index:5; }
  #toast.bad { border-left-color:var(--bad); } #toast.good { border-left-color:var(--good); }
  #bottom { display:flex; gap:12px; align-items:center; padding:0 12px; border-top:1px solid var(--line); background:var(--panel); height:36px; flex:none; overflow:hidden; }
  #hint { color:var(--muted); font-size:12px; margin:0; flex:1; min-width:0; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; line-height:1.3; }
  #st { font-size:12px; margin:0; color:var(--muted); max-width:34%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #stats { display:none; }
  .legend { display:flex; gap:10px; font-size:11px; color:var(--muted); }
  .legend i { display:inline-block; width:9px; height:9px; border-radius:50%; vertical-align:-1px; margin-right:3px; border:1px solid #fff; }
  @media (max-width: 760px) {
    #main { flex-direction:column-reverse; }
    #tools { width:auto; border-right:none; border-top:1px solid var(--line); max-height:none; overflow-x:auto; overflow-y:hidden; display:flex; gap:10px; padding:6px 8px; }
    .tg { margin:0; flex:none; } .tgb { flex-wrap:nowrap; }
    #top { gap:4px 10px; padding:6px 8px; } .util, .legend { display:none; }
    #info { right:8px; max-width:none; }
  }
</style>
</head>
<body>
<header id="top">
  <div class="stat"><small>Казна</small><b id="money">—</b><span id="net"></span></div>
  <div class="stat"><small>Жители</small><b id="pop">0</b></div>
  <div class="stat"><small>Рабочие места</small><b id="jobs">0</b></div>
  <div class="stat"><small>Безработица</small><b id="unemp">—</b></div>
  <div class="rci" title="Спрос на зоны">
    <div><i id="d-r" style="background:#3F8F4E"></i><span>Ж</span></div>
    <div><i id="d-c" style="background:#3D7DC8"></i><span>Т</span></div>
    <div><i id="d-i" style="background:#D49A22"></i><span>П</span></div>
    <div><i id="d-o" style="background:#8A5CC4"></i><span>О</span></div>
  </div>
  <div class="util"><div><span class="k">Свет</span><span id="u-p">—</span></div><div><span class="k">Вода</span><span id="u-w">—</span></div><div><span class="k">Стоки</span><span id="u-s">—</span></div></div>
  <span class="sp"></span>
  <div class="stat"><small id="mile"></small><b id="clock">—</b></div>
  <div class="grp" role="group" aria-label="Скорость">
    <button type="button" data-speed="0" aria-label="Пауза">❚❚</button>
    <button type="button" data-speed="1" aria-label="Скорость 1">▶</button>
    <button type="button" data-speed="2" aria-label="Скорость 2">▶▶</button>
    <button type="button" data-speed="3" aria-label="Скорость 3">▶▶▶</button>
  </div>
  <button type="button" id="b-budget">Бюджет</button>
  <button type="button" id="b-new">Новый город</button>
</header>
<div id="main">
  <aside id="tools" aria-label="Инструменты"></aside>
  <div id="stage">
    <svg id="sv" viewBox="0 0 800 500" role="img" aria-label="Карта города">
      <g id="world"><g id="terrain"></g><g id="cells"></g><g id="ghost"></g><g id="roads"></g><g id="lots"></g><g id="agents"></g><g id="nodes"></g><g id="exits"></g><g id="prev"></g></g>
    </svg>
    <div id="v3d" hidden></div>
    <div class="float" id="f-tl">
      <div class="grp" role="group" aria-label="Слои">
        <button type="button" data-ovl="none" aria-pressed="true">Обычный</button>
        <button type="button" data-ovl="power" aria-pressed="false">Свет</button>
        <button type="button" data-ovl="water" aria-pressed="false">Вода</button>
        <button type="button" data-ovl="happy" aria-pressed="false">Счастье</button>
        <button type="button" data-ovl="svc" aria-pressed="false">Услуги</button>
      </div>
    </div>
    <div class="float" id="f-tr">
      <div class="grp" role="group" aria-label="Масштаб">
        <button id="z-out" type="button" aria-label="Отдалить">−</button>
        <button id="z-in" type="button" aria-label="Приблизить">+</button>
      </div>
      <button id="b-3d" type="button" aria-pressed="false">3D</button>
      <div class="grp" id="g3d" role="group" aria-label="Поворот и наклон" hidden>
        <button id="r-l" type="button" aria-label="Повернуть влево">⟲</button>
        <button id="r-r" type="button" aria-label="Повернуть вправо">⟳</button>
        <button id="t-tilt" type="button">Наклон 60°</button>
      </div>
      <button id="b-life" type="button" aria-pressed="true" title="Жители и машины на улицах">Жизнь</button>
    </div>
    <div id="info" hidden></div>
    <div id="budget" hidden><h2>Бюджет</h2><button type="button" id="bud-x" aria-label="Закрыть">×</button><div id="bud-body"></div></div>
    <div id="toast" hidden></div>
  </div>
</div>
<footer id="bottom">
  <p id="hint"></p>
  <div class="legend"><span><i style="background:#F2C230"></i>нет света</span><span><i style="background:#3C8DD0"></i>нет воды</span><span><i style="background:#8C7A5B"></i>нет стоков</span><span><i style="background:#D9363E"></i>нет дороги к выезду</span></div>
  <p id="st"></p><p id="stats"></p>
</footer>
<script>/*
 * City3D — общий 3D-вид города для всех прототипов (редактор дорог,
 * просмотрщик симуляции жизни). Один и тот же код рисует землю, дороги,
 * процедурные дома, выезды и жителей, и одинаково управляет камерой.
 *
 * Обычный скрипт без модулей: задаёт глобальный объект City3D. Нужен
 * three.js r128 (глобальный THREE) — City3D.loadThree() подгружает его с
 * cdnjs. Единицы — как в редакторе: клетка = 16 единиц (4 м), этаж = клетка.
 *
 * Описание сцены (setScene):
 *   roadHalfWidth  — полуширина дороги;
 *   segments       — [{a:[x,y], b:[x,y]}] оси звеньев; полосы дорог и
 *                    «пятачки» узлов строятся здесь же;
 *   nodes          — [[x,y]] узлы (пятачки);
 *   zoneCells      — [многоугольник] клетки зонирования (необязательно);
 *   buildings      — [{outline, parts?, floors, style, type, bad?, plain?, color?}]:
 *                    plain — простая призма цвета color (стройка, заброшенный дом, ТЭС);
 *                    outline — контур дома (если нет — простые призмы по parts);
 *                    style — индекс в City3D.STYLES; type — res / com / work;
 *   sidewalk       — ширина тротуара (0 — нет): проезжая часть — roadHalfWidth − sidewalk;
 *   crosswalks     — {unit, skip:[[x,y]]}: рисовать зебры у концов звеньев (кроме skip);
 *   gates          — [{at:[x,y], dir:[dx,dy], ok}] выезды во внешний мир;
 *   areas          — [{poly | polys, color, label, y}] плоские площадки (например, «Город», река, зоны).
 * Жители — setMarkers([{x, y, z, color, label, selected, car, person}]): кружок с номером
 * (если label задан), машина {x, y, heading, color}, пешеход {x, y, heading, color};
 * машины и пешеходы рисуются пачками (InstancedMesh) — тысячи сразу.
 */
(function(){
'use strict';
var STYLES=[
{name:'охра',wall:'#D6B36A',trim:'#F1EADB',plinth:'#B89A6A',roof:'#2F4B3F',roofType:'mansard',arch:true},
{name:'кремовый сталинский',wall:'#E2D2BA',trim:'#F5EFE4',plinth:'#8F6A5A',roof:'#3A4048',roofType:'mansard',arch:false},
{name:'оливковый',wall:'#C6CB9C',trim:'#ECEADB',plinth:'#A2A682',roof:'#4D535A',roofType:'mansard',arch:false},
{name:'серо-сиреневый',wall:'#A7AAC2',trim:'#CDCFDD',plinth:'#8A8DA6',roof:'#6C6F84',roofType:'flat',arch:false},
{name:'красно-белый',wall:'#B5533F',trim:'#EEE6D8',plinth:'#E2D8C8',roof:'#3D6A56',roofType:'mansard',arch:true},
{name:'терракотовый',wall:'#D58B7B',trim:'#F2E8DE',plinth:'#C4AC93',roof:'#7A3D35',roofType:'mansard',arch:true},
{name:'светло-серый',wall:'#CEC8BE',trim:'#E8E3DA',plinth:'#9B948A',roof:'#5D6066',roofType:'flat',arch:false},
{name:'бежевый кирпич',wall:'#C7A07C',trim:'#EADDC9',plinth:'#8A6C56',roof:'#4E4846',roofType:'mansard',arch:false}];
// цвета карты — общие для 2D и 3D во всех прототипах
var COLORS={ground:'#E6E0CC',sky:'#DFE7EA',road:'#5A5F66',roadLine:'#F2F2F2',zoneCell:'#9ED38F',zoneCell3D:'#B5D8A4',
  zone:{res:'#3F8F4E',com:'#3D7DC8',work:'#D49A22'},gate:'#2F6F8F',bad:'#D9363E',area:'#D6DAE0',areaEdge:'#8A93A0',
  sidewalk:'#C9C6BD',crosswalk:'#F4F4F0'};
// улица: зебра — поперёк проезжей части, центр в crossAt м от узла (граница перекрёстка 5 м + 1.5),
// шириной crossLen м вдоль улицы; полосы по 0.5 м через 0.5 м (как в симуляции движения)
var STREET={crossAt:6.5,crossLen:3,stripe:0.5};
/*
 * Зебры для описания сцены: у каждого конца каждого звена, кроме ворот (skip — точки узлов,
 * где зебр нет). u — единиц в метре (редактор — 4, просмотрщик переводит метры в те же единицы).
 * Возвращает плоские многоугольники полос.
 */
function crosswalkPolys(desc){
  var cw=desc.crosswalks;if(!cw||!desc.sidewalk)return [];
  var u=cw.unit||4,C=desc.roadHalfWidth-desc.sidewalk,at=STREET.crossAt*u,hl=STREET.crossLen*u/2,sw=STREET.stripe*u,out=[];
  var skip=(cw.skip||[]),isSkip=function(p){return skip.some(function(q){return Math.hypot(q[0]-p[0],q[1]-p[1])<1e-3})};
  (desc.segments||[]).forEach(function(sg){[[sg.a,sg.b],[sg.b,sg.a]].forEach(function(pr){var P=pr[0],Q=pr[1];if(isSkip(P))return;
    var d=nrm(sub(Q,P)),n=[-d[1],d[0]],M=add(P,mul(d,at));
    for(var k=-C+sw/2;k<=C-sw/2+1e-6;k+=2*sw){var c=add(M,mul(n,k));
      out.push([add(add(c,mul(d,-hl)),mul(n,-sw/2)),add(add(c,mul(d,hl)),mul(n,-sw/2)),add(add(c,mul(d,hl)),mul(n,sw/2)),add(add(c,mul(d,-hl)),mul(n,sw/2))])}})});
  return out;
}
// стили домов по типу: из них выбирает редактор, по ним же красит симуляция
var ZONE_STYLES={res:[0,5,7,1,2,4],com:[6],work:[3]};
function shade(hex,f){var n=parseInt(hex.slice(1),16),c=[n>>16,(n>>8)&255,n&255].map(function(v){return Math.round(f<0?v*(1+f):v+(255-v)*f)});return '#'+c.map(function(v){return ('0'+v.toString(16)).slice(-2)}).join('')}
// цвет дома в 2D: цвет типа, оттенок свой у каждого дома (k — любое целое)
function lotFill(type,k){return shade(COLORS.zone[type]||COLORS.zone.res,(((k%5)+5)%5-2)*0.06)}

function add(a,b){return [a[0]+b[0],a[1]+b[1]]}function sub(a,b){return [a[0]-b[0],a[1]-b[1]]}function mul(a,k){return [a[0]*k,a[1]*k]}
function dot(a,b){return a[0]*b[0]+a[1]*b[1]}function len(a){return Math.hypot(a[0],a[1])}function nrm(a){var l=len(a);return [a[0]/l,a[1]/l]}
function cr(a,b){return a[0]*b[1]-a[1]*b[0]}
function segDist(p,a,b){var ab=sub(b,a),l2=dot(ab,ab),t=l2?Math.max(0,Math.min(1,dot(sub(p,a),ab)/l2)):0;return len(sub(p,add(a,mul(ab,t))))}
function bbox(P){var b=[Infinity,Infinity,-Infinity,-Infinity];P.forEach(function(q){if(q[0]<b[0])b[0]=q[0];if(q[1]<b[1])b[1]=q[1];if(q[0]>b[2])b[2]=q[0];if(q[1]>b[3])b[3]=q[1]});return b}
function bbHit(a,b,m){m=m||0;return a[0]<=b[2]+m&&b[0]<=a[2]+m&&a[1]<=b[3]+m&&b[1]<=a[3]+m}
function signedArea(P){var a=0;for(var i=0;i<P.length;i++){var q=P[(i+1)%P.length];a+=P[i][0]*q[1]-q[0]*P[i][1]}return a/2}
// сдвиг контура наружу (d>0) или внутрь (d<0) со скосом углов
function offsetPoly(P,d){
var sg=signedArea(P)>0?1:-1,out=[];
for(var i=0;i<P.length;i++){var pr=P[(i+P.length-1)%P.length],cu=P[i],nx=P[(i+1)%P.length];
var e1=nrm(sub(cu,pr)),e2=nrm(sub(nx,cu)),n1=mul([e1[1],-e1[0]],sg),n2=mul([e2[1],-e2[0]],sg),m=add(n1,n2),lm=len(m);
m=lm<1e-6?n1:mul(m,1/lm);var k=Math.max(0.35,dot(m,n1));out.push(add(cu,mul(m,d/k)));}
return out;
}
function seeded(seed){var x=seed*9301+49297;return function(){x=(x*9301+49297)%233280;return x/233280}}

function loadThree(cb,onError){
if(window.THREE)return cb();
var sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
sc.onload=cb;sc.onerror=function(){if(onError)onError()};document.head.appendChild(sc);
}

// ---------- окна: процедурные текстуры фасада по стилю ----------
var GLASS='#3F4D66',GLASS2='#5C6E8C',LIT='#F3E2A6',texCache={};
function facadeTex(si,kind,R){
var key=si+kind;if(texCache[key])return texCache[key];
var st=STYLES[si],B=64,F=64,rows=kind==='up'?4:1,cv=document.createElement('canvas');cv.width=B*4;cv.height=F*rows;
var g=cv.getContext('2d'),rnd=seeded(si*7+(kind==='up'?1:2));
g.fillStyle=kind==='up'?st.wall:st.plinth;g.fillRect(0,0,cv.width,cv.height);
function win(x,y,w,h,lit,arch){
g.fillStyle=st.trim;g.beginPath();
if(arch){g.moveTo(x-3,y+h+2);g.lineTo(x-3,y+w/2);g.arc(x+w/2,y+w/2,w/2+3,Math.PI,0);g.lineTo(x+w+3,y+h+2);}else g.rect(x-3,y-3,w+6,h+5);
g.fill();
var gr=g.createLinearGradient(0,y,0,y+h);gr.addColorStop(0,lit?LIT:GLASS2);gr.addColorStop(1,lit?'#E8C979':GLASS);g.fillStyle=gr;g.beginPath();
if(arch){g.moveTo(x,y+h);g.lineTo(x,y+w/2);g.arc(x+w/2,y+w/2,w/2,Math.PI,0);g.lineTo(x+w,y+h);}else g.rect(x,y,w,h);
g.fill();

<script>// ---- life-sim/rng.mjs ----
// Детерминированный генератор случайных чисел (mulberry32): одна и та же
// последовательность при одном seed на любой машине. Math.random в симуляции
// не используется нигде.
function makeRng(seed){
  let a=seed>>>0;
  const next=()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return ((t^(t>>>14))>>>0)/4294967296;};
  return {
    next,                                   // [0, 1)
    int:(n)=>Math.floor(next()*n),          // 0..n-1
    shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(next()*(i+1));const x=arr[i];arr[i]=arr[j];arr[j]=x}return arr;},
  };
}

// ---- life-sim/config.mjs ----
// Параметры симуляции по умолчанию. Всё, что не пришло из снимка мира.
const DEFAULTS={

  cars:null,                // у скольких жителей есть машина; null — доля carShare
  carShare:1,               // доля жителей с машиной (если cars не задано)
  speed:{walk:1.3,car:8.3}, // м/с: пешком ~4.7 км/ч, на машине ~30 км/ч по деревне
  shopVisitorsPerCell:1,    // покупателей одновременно на клетку·этаж магазина
  tickSeconds:60,           // один тик — одна игровая минута
  // часы работы мест по виду: [открытие, закрытие), часы суток
  hours:{shop:[9,20],work:[8,17],outside:[8,20],cafe:[8,23]},
  needs:{

    earlyMax:40,            // выезжает на работу раньше нужного на 0…40 мин (у каждого своё) — час пик размазан
    shopAt:2,               // идёт в магазин, когда дома порций еды не больше

  traffic:{                 // движение машин (traffic.mjs), метры и секунды

    laneOffset:1.4,         // центр полосы от оси дороги

    lotDepthGap:0.3,        // место на земле: отступ от края дороги

    manSpeed:1.5,           // скорость при парковке и выезде с места, м/с

    stopGap:0.5,            // от бампера до границы перекрёстка, когда ждёт
    accel:2,decel:3,        // м/с²

  },

    dt:1,                   // шаг пешеходов, с (кратен шагу машин; 1 с — 1.3 м)
    crossAt:1.5,            // зебра — сразу за границей перекрёстка: центр в box + crossAt от узла
    crossLen:3,             // ширина зебры вдоль дороги: столько полосы у перекрёстка машины держат свободным
    walkMin:120,walkMax:450,// до скольких метров житель идёт пешком, а не едет (у каждого своё, случайно)
    keepRight:0.4,          // идёт правее середины тротуара

  },
  outside:{                 // внешний мир за каждыми воротами — запись с числами, не агенты
    jobs:40,                // рабочих мест снаружи, доступных жителям
    minutesBeyondGate:20,   // от ворот до места снаружи (на машине)
    carOnly:true,           // без машины наружу не уехать (автобусов нет)
  },
};
function withDefaults(cfg={}){
  return {...DEFAULTS,...cfg,speed:{...DEFAULTS.speed,...cfg.speed},outside:{...DEFAULTS.outside,...cfg.outside},
    hours:{...DEFAULTS.hours,...cfg.hours},needs:{...DEFAULTS.needs,...cfg.needs},traffic:{...DEFAULTS.traffic,...cfg.traffic},peds:{...DEFAULTS.peds,...cfg.peds}};

// ---- life-sim/world.mjs ----
/*
 * Мир симуляции: снимок редактора (scenes/*.snapshot.json) → плоские массивы.
 *
 * Места (places) — всё, куда агент может пойти: жилой дом, магазин, рабочее
 * место, внешний мир за воротами. Агенты взаимодействуют только с местами,
 * не друг с другом. Каждое место — индекс во всех массивах places.*:
 *   kind     — HOME / SHOP / WORK / OUTSIDE
 *   beds     — мест для жизни (жилой дом)
 *   jobs     — рабочих мест (магазин, рабочий дом, внешний мир)
 *   visitors — покупателей одновременно (магазин, внешний мир)
 *   edge, t  — точка примыкания к дороге: звено и доля от его узла a;
 *              у внешнего мира edge = -1, а node — узел ворот
 *   extra    — секунды пути за воротами (только внешний мир)
 *
 * Дороги — звенья с длиной (м). Кратчайшие расстояния между узлами считаются
 * один раз (Флойд — Уоршелл: в деревне 5 узлов; для тысяч узлов заменить на
 * Дейкстру от нужных узлов). Время проезда = расстояние / скорость способа.
 * Пробки и загрузка — этап 4.
 */
const KIND={HOME:0,SHOP:1,WORK:2,OUTSIDE:3,CAFE:4};
const KIND_NAME=['дом','магазин','работа','внешний мир','кафе'];
const KIND_KEY=['home','shop','work','outside','cafe'];   // ключ часов работы в cfg.hours
const TYPE_KIND={res:KIND.HOME,com:KIND.SHOP,work:KIND.WORK};
const USE_KIND={food:KIND.SHOP,cafe:KIND.CAFE,work:KIND.WORK};
// места здания: без uses — одно по типу; с uses (смешанное назначение) — жильё, если есть
// жильцы, и по месту на каждое заведение (кафе, продукты, работа) с его числами и часами
function placesOf(b){
  if(!b.uses){const k=TYPE_KIND[b.type];if(k===undefined)throw new Error('неизвестный тип дома: '+b.type);return [{kind:k}]}
  const out=[];if(b.uses.beds>0)out.push({kind:KIND.HOME,beds:b.uses.beds});
  for(const u of b.uses.places){const k=USE_KIND[u.kind];if(k===undefined)throw new Error('неизвестный вид заведения: '+u.kind);
    out.push({kind:k,jobs:u.jobs,visitors:u.visitors,hours:u.hours,cat:u.cat,name:u.name})}
  return out;
}

function buildWorld(snap,cfg){
  if(snap.format!=='city-builder/world@1')throw new Error('неизвестный формат снимка: '+snap.format);
  const N=snap.nodes.length,E=snap.edges.length;
  const nodes={n:N,x:new Float64Array(N),y:new Float64Array(N)};
  snap.nodes.forEach((p,i)=>{nodes.x[i]=p[0];nodes.y[i]=p[1]});
  const edges={n:E,a:new Int32Array(E),b:new Int32Array(E),len:new Float64Array(E)};
  snap.edges.forEach((e,i)=>{edges.a[i]=e.a;edges.b[i]=e.b;edges.len[i]=e.length});

  // кратчайшие расстояния по дорогам между узлами, м
  const dist=new Float64Array(N*N).fill(Infinity);
  for(let i=0;i<N;i++)dist[i*N+i]=0;
  for(let e=0;e<E;e++){const a=edges.a[e],b=edges.b[e],l=edges.len[e];
    if(l<dist[a*N+b]){dist[a*N+b]=l;dist[b*N+a]=l}}
  for(let k=0;k<N;k++)for(let i=0;i<N;i++){const ik=dist[i*N+k];if(ik===Infinity)continue;
    for(let j=0;j<N;j++){const v=ik+dist[k*N+j];if(v<dist[i*N+j])dist[i*N+j]=v}}

  const per=snap.buildings.map(placesOf),P=per.reduce((s,x)=>s+x.length,0)+snap.gates.length;
  // src — номер здания (у ворот — номер ворот); open/close — свои часы работы (−1 — по виду, cfg.hours)
  const places={n:P,kind:new Uint8Array(P),beds:new Int32Array(P),jobs:new Int32Array(P),visitors:new Int32Array(P),
    edge:new Int32Array(P),t:new Float64Array(P),node:new Int32Array(P).fill(-1),extra:new Float64Array(P),
    x:new Float64Array(P),y:new Float64Array(P),src:new Int32Array(P),name:new Array(P),cat:new Array(P),
    open:new Float64Array(P).fill(-1),close:new Float64Array(P).fill(-1)};
  let i=0;
  snap.buildings.forEach((b,bi)=>{for(const u of per[bi]){
    const k=u.kind;places.kind[i]=k;places.edge[i]=b.edge;places.t[i]=b.t;places.x[i]=b.center[0];places.y[i]=b.center[1];places.src[i]=b.id;
    if(b.uses){places.beds[i]=u.beds||0;places.jobs[i]=u.jobs||0;places.visitors[i]=u.visitors||0;if(u.hours){places.open[i]=u.hours[0];places.close[i]=u.hours[1]}
      places.cat[i]=u.cat||KIND_NAME[k];places.name[i]=u.name?u.cat+' «'+u.name+'»':(u.cat||KIND_NAME[k])+' #'+b.id}
    else{
      if(k===KIND.HOME)places.beds[i]=b.capacity;else places.jobs[i]=b.capacity;
      if(k===KIND.SHOP)places.visitors[i]=Math.max(1,Math.round(b.cells*b.floors*cfg.shopVisitorsPerCell));
      places.cat[i]=KIND_NAME[k];places.name[i]=KIND_NAME[k]+' #'+b.id}
    i++}});
  for(const g of snap.gates){
    places.kind[i]=KIND.OUTSIDE;places.edge[i]=-1;places.node[i]=g.node;places.x[i]=nodes.x[g.node];places.y[i]=nodes.y[g.node];
    places.jobs[i]=cfg.outside.jobs;places.visitors[i]=1e9;places.extra[i]=cfg.outside.minutesBeyondGate*60;places.src[i]=g.id;
    places.name[i]='внешний мир: '+g.name;places.cat[i]='внешний мир';i++;
  }
  // для парковки на свободной земле движению нужны контуры зданий и ширина дороги
  const outlines=snap.buildings.map((b)=>b.outline||[]);
  // ширина улицы — от оси до домов, вместе с тротуаром (sidewalk; 0 — тротуара нет)
  const roadHalfWidth=(snap.render&&snap.render.roadHalfWidth)||cfg.traffic.roadHalfWidth;
  const sidewalk=(snap.render&&snap.render.sidewalk)||0;
  return {name:snap.name||'',nodes,edges,dist,places,cfg,outlines,roadHalfWidth,sidewalk};
}

// расстояние по дорогам между местами p и q, м (без пути за воротами)
function distance(w,p,q){
  const {places:pl,edges:ed,dist,nodes}=w,N=nodes.n;
  if(pl.edge[p]>=0&&pl.edge[p]===pl.edge[q])return Math.abs(pl.t[p]-pl.t[q])*ed.len[pl.edge[p]];
  const ends=(x)=>pl.edge[x]<0?[[pl.node[x],0]]:[[ed.a[pl.edge[x]],pl.t[x]*ed.len[pl.edge[x]]],[ed.b[pl.edge[x]],(1-pl.t[x])*ed.len[pl.edge[x]]]];
  let best=Infinity;
  for(const [u,du] of ends(p))for(const [v,dv] of ends(q)){const d=du+dist[u*N+v]+dv;if(d<best)best=d}
  return best;
}
// может ли агент добраться до места: наружу без машины — нет, если cfg.outside.carOnly (автобусов нет)
function reachable(w,q,hasCar){return !(w.places.kind[q]===KIND.OUTSIDE&&w.cfg.outside.carOnly&&!hasCar)}
// время в пути, с: по дорогам с ровной скоростью способа + путь за воротами
function travelTime(w,p,q,hasCar){
  if(!reachable(w,q,hasCar)||!reachable(w,p,hasCar))return Infinity;
  const v=hasCar?w.cfg.speed.car:w.cfg.speed.walk;
  return distance(w,p,q)/v+w.places.extra[p]+w.places.extra[q];
}

// ---- life-sim/population.mjs ----
/*
 * Жители — пачка массивов, индекс = номер жителя:
 *   home — место (жилой дом), где живёт;
 *   job  — место работы (магазин, рабочий дом, внешний мир) или -1;
 *   car  — 1, если есть машина.
 *
 * Расселение: по жилым домам по порядку, пока есть места.
 * Машины: у cfg.cars случайных жителей (по seed), по умолчанию у всех.
 * Работа (временное правило этапа 1, на этапе 3 заменится выбором по
 * полезности): жители в случайном порядке берут ближайшую по времени пути
 * свободную вакансию из тех, куда могут добраться; нет такой — безработный.
 */

function createPopulation(w,rng){
  const pl=w.places,cfg=w.cfg;
  let beds=0;for(let p=0;p<pl.n;p++)beds+=pl.beds[p];
  const n=cfg.population==null?beds:Math.min(cfg.population,beds);
  const A={n,home:new Int32Array(n),job:new Int32Array(n).fill(-1),car:new Uint8Array(n)};
  // расселение
  let a=0;
  for(let p=0;p<pl.n&&a<n;p++)for(let k=0;k<pl.beds[p]&&a<n;k++)A.home[a++]=p;
  // машины
  const order=rng.shuffle([...Array(n).keys()]);
  const cars=cfg.cars==null?Math.round(n*cfg.carShare):Math.min(cfg.cars,n);
  for(let i=0;i<cars;i++)A.car[order[i]]=1;
  assignJobs(w,A,rng);
  return A;
}

function assignJobs(w,A,rng){
  const pl=w.places,taken=new Int32Array(pl.n);
  const workplaces=[];for(let p=0;p<pl.n;p++)if(pl.jobs[p]>0)workplaces.push(p);
  for(const a of rng.shuffle([...Array(A.n).keys()])){
    let best=-1,bt=Infinity;
    for(const p of workplaces){if(taken[p]>=pl.jobs[p])continue;
      const t=travelTime(w,A.home[a],p,A.car[a]===1);if(t<bt){bt=t;best=p}}
    A.job[a]=best;if(best>=0)taken[best]++;
  }
}

// ---- life-sim/census.mjs ----
// Перепись: жильё, работа, вакансии, машины, путь до работы. Только чтение.

function census(w,A){
  const pl=w.places,filled=new Int32Array(pl.n),living=new Int32Array(pl.n);
  for(let a=0;a<A.n;a++){living[A.home[a]]++;if(A.job[a]>=0)filled[A.job[a]]++}
  const c={residents:A.n,beds:0,cars:0,
    jobs:{local:0,outside:0},employed:{local:0,outside:0},vacancies:{local:0,outside:0},
    unemployed:0,unemployedWithCar:0,unemployedNoCar:0,commuteMin:{avg:0,max:0},
    places:{homes:0,shops:0,works:0,gates:0,cafes:0},shopVisitors:0,roadKm:0,overfull:0};
  for(let p=0;p<pl.n;p++){
    const k=pl.kind[p],out=k===KIND.OUTSIDE?'outside':'local';
    c.beds+=pl.beds[p];
    if(pl.jobs[p]>0){c.jobs[out]+=pl.jobs[p];c.employed[out]+=filled[p];c.vacancies[out]+=pl.jobs[p]-filled[p]}
    if(filled[p]>pl.jobs[p]||living[p]>pl.beds[p])c.overfull++;
    c.places[['homes','shops','works','gates','cafes'][k]]++;
    if(k===KIND.SHOP)c.shopVisitors+=pl.visitors[p];
  }
  let sum=0,n=0;
  for(let a=0;a<A.n;a++){
    c.cars+=A.car[a];
    if(A.job[a]<0){c.unemployed++;if(A.car[a])c.unemployedWithCar++;else c.unemployedNoCar++;continue}
    const t=travelTime(w,A.home[a],A.job[a],A.car[a]===1)/60;sum+=t;n++;if(t>c.commuteMin.max)c.commuteMin.max=t;
  }
  c.commuteMin.avg=n?sum/n:0;
  for(let e=0;e<w.edges.n;e++)c.roadKm+=w.edges.len[e]/1000;
  return c;
}

function formatCensus(w,c){
  const f=(x)=>Math.round(x*10)/10;
  return [
    `${w.name}: дорог ${f(c.roadKm*1000)} м, ворот ${c.places.gates}`,
    `Места: жилых домов ${c.places.homes} (мест ${c.beds}), магазинов ${c.places.shops} (покупателей одновременно ${c.shopVisitors}), кафе ${c.places.cafes}, рабочих мест-заведений ${c.places.works}`,
    `Жителей ${c.residents}, с машиной ${c.cars}`,
    `Рабочих мест: в деревне ${c.jobs.local}, снаружи ${c.jobs.outside}`,
    `Работают: в деревне ${c.employed.local}, снаружи ${c.employed.outside}`,
    `Безработных ${c.unemployed} (с машиной ${c.unemployedWithCar}, без машины ${c.unemployedNoCar})`,
    `Свободных вакансий: в деревне ${c.vacancies.local}, снаружи ${c.vacancies.outside}`,
    `Путь до работы: в среднем ${f(c.commuteMin.avg)} мин, максимум ${f(c.commuteMin.max)} мин`,
  ].join('\n');
}

// ---- life-sim/life.mjs ----
/*
 * Сутки жителя: часы и потребности (этап 2).
 *
 * Расписания у жителей нет. Есть потребности, которые растут со временем:
 *   усталость (fatigue) — растёт, пока не спит, и падает во сне;
 *   голод (hunger)       — растёт всегда, быстрее днём; гасится едой;
 *   работа (owed)        — «долг» рабочих часов: +8 часов за сутки, гасится работой;
 *   еда дома (food)      — порции; кончаются — нужен магазин.
 * Расписание есть у МЕСТ: часы работы (магазин 9–20, мастерская 8–17,
 * внешний мир 8–20). Утро, рабочий день и вечерние покупки получаются сами
 * из потребностей и часов работы мест.
 *
 * Каждый тик (1 игровая минута) житель:
 *   1. копит потребности;
 *   2. в пути — до тика прибытия: его ставят движение машин (traffic.mjs)
 *      или пешеходов (peds.mjs); без них — время по формуле;
 *   3. на месте — продолжает занятие, пока оно не кончилось:
 *        сон — до утра (своё время подъёма 5:30–7:00); еда — 30 мин; покупки — 20 мин;
 *        работа — пока есть долг и место открыто (проголодался — ест на месте);
 *   4. свободен — выбирает самое срочное занятие:
 *        сон, если валится с ног > еда (где стоит, из своих запасов) >
 *        ночной сон (дома) > голоден без еды —
 *        магазин (с работы — перерыв на обед) > работа (на своём
 *        месте; выезжает так, чтобы приехать к открытию) > магазин (ближайший
 *        открытый со свободным местом; выбор по полезности — этап 3) > домой.
 *
 * Состояние — пачка массивов, индекс = номер жителя. Жители обходятся по
 * порядку, случайность — только из rng: при одном seed всё повторяется.
 */

const MODE={CAR:0,WALK:1};
/*
 * Пешком или на машине (modeFor):
 *   - в Город и из Города — на машине; если сцена разрешает (outside.carOnly
 *     false — город вокруг, есть транспорт), без машины — пешком до выезда;
 *   - по деревне — пешком, если идти не дальше своего порога walkMax (у
 *     каждого свой, 120–450 м), иначе на машине, но только если она здесь;
 *     машина осталась в другом месте — пешком.
 * В Город, а машина не здесь: сначала дойти до неё пешком (travel).
 * Домой, а машина не дома и не здесь (уехал на ней, потом ходил пешком):
 * сначала дойти до машины и вернуться на ней — машины не теряются.
 */
function walkDist(w,L,from,to){return L.walkDist?L.walkDist(from,to):distance(w,from,to)}
function modeFor(w,A,L,a,from,to){
  const pl=w.places;
  if(pl.kind[to]===KIND.OUTSIDE||pl.kind[from]===KIND.OUTSIDE)
    return w.cfg.outside.carOnly||(A.car[a]&&L.carAt[a]===from)?MODE.CAR:MODE.WALK;
  if(!A.car[a]||L.carAt[a]!==from)return MODE.WALK;
  if(to===A.home[a])return MODE.CAR;   // машина здесь, а сам — домой: машину домой (иначе так и останется стоять)
  return walkDist(w,L,from,to)>L.walkMax[a]?MODE.CAR:MODE.WALK;
}
// время в пути для решений (когда выезжать, какой магазин ближе), с
function tripSeconds(w,A,L,a,from,to){
  if(from===to)return 0;
  const pl=w.places,out=pl.kind[to]===KIND.OUTSIDE;
  const carOnly=w.cfg.outside.carOnly;
  if(out&&!A.car[a]&&carOnly)return Infinity;
  if(out&&carOnly&&L.carAt[a]!==from)return walkDist(w,L,from,L.carAt[a])/w.cfg.speed.walk+travelTime(w,L.carAt[a],to,true);
  return modeFor(w,A,L,a,from,to)===MODE.CAR?travelTime(w,from,to,true):walkDist(w,L,from,to)/w.cfg.speed.walk+pl.extra[from]+pl.extra[to];
}

const ACT={IDLE:0,SLEEP:1,EAT:2,WORK:3,SHOP:4,TRAVEL:5};
const ACT_NAME=['дома/свободен','сон','еда','работа','покупки','в пути'];

function createLife(w,A,rng){
  const n=A.n,pl=w.places,cfg=w.cfg;
  const L={tick:0,
    at:new Int32Array(n),         // место, где житель сейчас (-1 — в пути)
    to:new Int32Array(n).fill(-1),// куда едет
    from:new Int32Array(n).fill(-1),
    depart:new Int32Array(n),arrive:new Int32Array(n), // тики выезда и прибытия
    intent:new Uint8Array(n),     // зачем едет
    act:new Uint8Array(n),        // занятие сейчас
    actEnd:new Int32Array(n),     // тик конца занятия на время (еда, покупки)
    fatigue:new Float64Array(n),hunger:new Float64Array(n),owed:new Float64Array(n),food:new Int32Array(n),
    bed:new Float64Array(n),wake:new Float64Array(n), // своя ночь: ложится 21:30–23:00, встаёт 5:30–7:00
    shoppers:new Int32Array(pl.n),workers:new Int32Array(pl.n),
    open:new Float64Array(pl.n),close:new Float64Array(pl.n),
    log:[],                       // события: [тик, житель, занятие, место]
    trips:cfg.traffic.on?[]:null, // новые поездки — их забирает движение (машины и пешеходы)
    mode:new Uint8Array(n),       // как добирается сейчас: MODE.CAR / MODE.WALK
    carAt:new Int32Array(n).fill(-1), // где стоит его машина (место)
    walkMax:new Float64Array(n),  // до скольких метров идёт пешком
    walkDist:null,                // длина пешего пути по тротуарам (задаёт peds.mjs)
    eatOut:new Uint8Array(n),     // ест в кафе и занимает там место
    cafeLove:new Float64Array(n), // насколько любит обедать в кафе (0…1)
    early:new Float64Array(n),    // на сколько часов раньше нужного выезжает на работу
    shopList:[],cafeList:[],      // где покупают еду домой; где едят
  };
  // часы работы: свои у места (заведения Дорчола) или по виду места
  for(let p=0;p<pl.n;p++){const h=pl.open[p]>=0?[pl.open[p],pl.close[p]]:cfg.hours[KIND_KEY[pl.kind[p]]];if(h){L.open[p]=h[0];L.close[p]=h[1]}
    if(pl.kind[p]===KIND.CAFE)L.cafeList.push(p);else if(pl.visitors[p]>0)L.shopList.push(p)}
  // начало: полночь, все дома и спят; потребности немного разные
  for(let a=0;a<n;a++){
    L.at[a]=A.home[a];L.act[a]=ACT.SLEEP;
    L.bed[a]=21.5+1.5*rng.next();L.wake[a]=5.5+1.5*rng.next();
    L.fatigue[a]=0.5+0.2*rng.next();
    L.hunger[a]=0.2+0.2*rng.next();
    L.owed[a]=A.job[a]>=0?2+rng.next():0;
    L.food[a]=2+rng.int(5);
    L.carAt[a]=A.home[a];L.walkMax[a]=cfg.peds.walkMin+(cfg.peds.walkMax-cfg.peds.walkMin)*rng.next();
    L.cafeLove[a]=rng.next();L.early[a]=cfg.needs.earlyMax/60*rng.next();
  }
  return L;
}

const hourOf=(L,cfg)=>(L.tick*cfg.tickSeconds/3600)%24;
const dayOf=(L,cfg)=>Math.floor(L.tick*cfg.tickSeconds/86400);
function isNight(h,nt){return nt[0]>nt[1]?(h>=nt[0]||h<nt[1]):(h>=nt[0]&&h<nt[1])}
function isOpen(L,p,h){return L.close[p]>L.open[p]&&h>=L.open[p]&&h<L.close[p]}

// дневник: [тик, житель, занятие, место, как добирается (только для поездок)]
function setAct(L,a,act,p,end){L.act[a]=act;L.actEnd[a]=end;L.log.push(act===ACT.TRAVEL?[L.tick,a,act,p,L.mode[a]]:[L.tick,a,act,p])}

function startAct(w,A,L,a,act){
  const p=L.at[a],nd=w.cfg.needs,mt=60/w.cfg.tickSeconds;
  if(act===ACT.EAT){
    // в кафе: еда своя не нужна; посетитель занимает место (работник кафе ест там же, без места)
    if(w.places.kind[p]===KIND.CAFE){if(A.job[a]!==p){L.shoppers[p]++;L.eatOut[a]=1}setAct(L,a,act,p,L.tick+Math.round(nd.cafeMinutes*mt));return}
    L.food[a]--;setAct(L,a,act,p,L.tick+Math.round(nd.eatMinutes*mt));return}
  if(act===ACT.SHOP){L.shoppers[p]++;setAct(L,a,act,p,L.tick+Math.round(nd.shopMinutes*mt));return}
  if(act===ACT.WORK){L.workers[p]++;setAct(L,a,act,p,-1);return}
  setAct(L,a,act,p,-1);
}
function endAct(w,A,L,a){
  const p=L.at[a],act=L.act[a];
  if(act===ACT.SHOP){L.shoppers[p]--;L.food[a]+=w.cfg.needs.buyPortions}
  else if(act===ACT.WORK)L.workers[p]--;
  else if(act===ACT.EAT){L.hunger[a]=0;if(L.eatOut[a]){L.shoppers[p]--;L.eatOut[a]=0}}
  L.act[a]=ACT.IDLE;
}
// поездка: на машине — через движение по дорогам (traffic.mjs ставит тик
// прибытия, когда машина встала на место); без машины или без движения —
// время по формуле
function travel(w,A,L,a,dest,intent){
  const from=L.at[a];
  // в Город, а машина в другом месте — сначала к машине пешком (на месте решит снова)
  if(w.places.kind[dest]===KIND.OUTSIDE&&w.cfg.outside.carOnly&&L.carAt[a]!==from&&L.carAt[a]>=0){dest=L.carAt[a];intent=ACT.IDLE}
  // домой — с машиной: она осталась в другом месте — сначала за ней (на месте решит снова)
  else if(dest===A.home[a]&&A.car[a]&&L.carAt[a]>=0&&L.carAt[a]!==from&&L.carAt[a]!==dest){dest=L.carAt[a];intent=ACT.IDLE}
  const mode=modeFor(w,A,L,a,from,dest);
  L.from[a]=from;L.to[a]=dest;L.at[a]=-1;L.intent[a]=intent;L.depart[a]=L.tick;L.mode[a]=mode;
  if(L.trips){L.arrive[a]=2147483647;L.trips.push(a)}
  else{const sec=mode===MODE.CAR?travelTime(w,from,dest,true):walkDist(w,L,from,dest)/w.cfg.speed.walk;L.arrive[a]=L.tick+Math.max(1,Math.ceil(sec/w.cfg.tickSeconds))}
  setAct(L,a,ACT.TRAVEL,dest,L.arrive[a]);
}
// свободный житель выбирает занятие: возвращает [занятие, место]
function choose(w,A,L,a,h){
  const pl=w.places,nd=w.cfg.needs,here=L.at[a],home=A.home[a],car=A.car[a]===1;
  // сон — только дома; валится с ног — спать, даже голодным
  if(L.fatigue[a]>=nd.sleepAt)return [ACT.SLEEP,home];
  // еда (перед обычным сном тоже поест):
  //   в кафе — прямо здесь; дома — из своих запасов;
  //   не дома — в кафе неподалёку, если любит кафе (или своей еды нет), иначе из своих запасов (обед с собой);
  //   еды нет — кафе или магазин, что ближе
  const hungry=L.hunger[a]>=nd.eatAt;
  if(hungry){
    if(w.places.kind[here]===KIND.CAFE&&(A.job[a]===here||L.shoppers[here]<w.places.visitors[here]))return [ACT.EAT,here];
    if(here===home&&L.food[a]>0)return [ACT.EAT,here];
    if(here!==home&&(L.cafeLove[a]>=nd.cafeLoveAt||L.food[a]===0)){const c=nearestCafe(w,A,L,a,here,h,nd.cafeNearSeconds);if(c>=0)return [ACT.EAT,c]}
    if(L.food[a]>0)return [ACT.EAT,here];
  }
  if(isNight(h,[L.bed[a],L.wake[a]])&&L.fatigue[a]>=nd.sleepAtNight)return [ACT.SLEEP,home];
  // голоден, а еды нет — кафе или магазин, что ближе (с работы — перерыв на обед)
  if(hungry){const c=nearestCafe(w,A,L,a,here,h,Infinity),s=nearestShop(w,A,L,a,here,h);
    if(c>=0&&(s<0||tripSeconds(w,A,L,a,here,c)<=tripSeconds(w,A,L,a,here,s)))return [ACT.EAT,c];if(s>=0)return [ACT.SHOP,s]}
  // работа — на своём месте; выехать так, чтобы приехать к открытию
  const j=A.job[a];
  // на месте работы — вернуться к работе, если должен хотя бы 15 мин; ехать из другого места — если должен workMinOwed часов
  if(j>=0&&L.owed[a]>(here===j?0.25:nd.workMinOwed)){
    const tt=tripSeconds(w,A,L,a,here,j)/3600;
    if(here===j&&!isOpen(L,j,h)){if(h<L.open[j]&&L.open[j]-h<1)return [ACT.IDLE,here]}   // приехал заранее — ждёт открытия
    else if(h+tt+L.early[a]>=L.open[j]&&h+tt<L.close[j]-0.5)return [ACT.WORK,j];
  }
  // магазин — когда дома мало еды
  if(L.food[a]<=nd.shopAt){const s=nearestShop(w,A,L,a,here,h);if(s>=0)return [ACT.SHOP,s]}
  return [ACT.IDLE,home];
}
// ближайший открытый магазин со свободным местом (выбор по полезности — этап 3)
function nearestShop(w,A,L,a,here,h){return nearestOf(w,A,L,a,here,h,L.shopList,Infinity)}
// ближайшее открытое кафе со свободным местом не дальше maxSec
function nearestCafe(w,A,L,a,here,h,maxSec){return nearestOf(w,A,L,a,here,h,L.cafeList,maxSec)}
function nearestOf(w,A,L,a,here,h,list,maxSec){
  const pl=w.places;let best=-1,bt=maxSec;
  for(const p of list){if(L.shoppers[p]>=pl.visitors[p])continue;
    const tt=tripSeconds(w,A,L,a,here,p);if(tt>bt||tt===Infinity||!isOpen(L,p,h+tt/3600))continue;
    if(tt<bt||best<0){bt=tt;best=p}}
  return best;
}

function step(w,A,L){
  const cfg=w.cfg,nd=cfg.needs,dtH=cfg.tickSeconds/3600,h=hourOf(L,cfg);
  for(let a=0;a<A.n;a++){
    // 1. потребности
    const asleep=L.act[a]===ACT.SLEEP;
    L.fatigue[a]=Math.max(0,L.fatigue[a]+(asleep?nd.fatigueSleep:nd.fatigueAwake)*dtH);
    L.hunger[a]=Math.min(1.5,L.hunger[a]+(asleep?nd.hungerSleep:nd.hungerAwake)*dtH);
    if(A.job[a]>=0)L.owed[a]+=nd.workHoursPerDay/24*dtH-(L.act[a]===ACT.WORK?dtH:0);
    // 2. в пути
    if(L.act[a]===ACT.TRAVEL){
      if(L.tick<L.arrive[a])continue;
      L.at[a]=L.to[a];L.to[a]=-1;L.act[a]=ACT.IDLE;if(L.mode[a]===MODE.CAR)L.carAt[a]=L.at[a];
      const it=L.intent[a],p=L.at[a];
      if((it===ACT.SHOP||it===ACT.EAT&&w.places.kind[p]===KIND.CAFE&&A.job[a]!==p)&&(L.shoppers[p]>=w.places.visitors[p]||!isOpen(L,p,h))){}  // занято или закрыто — выберет снова
      else if(it===ACT.WORK&&!isOpen(L,p,h)){}   // закрыто (приехал заранее — подождёт на месте, см. выбор)
      else if(it!==ACT.IDLE){startAct(w,A,L,a,it);continue}
      else setAct(L,a,ACT.IDLE,p,-1);
    }
    // 3. занятие продолжается?
    const act=L.act[a],p=L.at[a];
    if(act===ACT.SLEEP){if(L.fatigue[a]>0||isNight(h,[L.bed[a],L.wake[a]]))continue;endAct(w,A,L,a)} // спит до утра
    else if(act===ACT.EAT||act===ACT.SHOP){if(L.tick<L.actEnd[a])continue;endAct(w,A,L,a)}
    else if(act===ACT.WORK){
      if(L.owed[a]>0&&isOpen(L,p,h)){
        // работает в магазине — там же и покупает еду домой, если её мало
        if(w.places.kind[p]===KIND.SHOP&&L.food[a]<=nd.shopAt){L.food[a]+=nd.buyPortions;L.log.push([L.tick,a,ACT.SHOP,p])}
        // проголодался — перерыв на обед (где — решит выбор: с собой, в кафе, в магазин); поесть негде — работает дальше
        if(L.hunger[a]>=nd.eatAt){if(L.food[a]===0&&w.places.kind[p]!==KIND.CAFE&&nearestShop(w,A,L,a,p,h)<0&&nearestCafe(w,A,L,a,p,h,Infinity)<0)continue;
          endAct(w,A,L,a);}
        else continue;}
      else endAct(w,A,L,a);
    }
    // 4. свободен — выбрать занятие
    const [na,dest]=choose(w,A,L,a,h);
    if(dest===L.at[a]){if(na!==ACT.IDLE||act!==ACT.IDLE)startAct(w,A,L,a,na)}
    else travel(w,A,L,a,dest,na);
  }
  L.tick++;
}

// снимок: сколько жителей где и чем заняты
function snapshot(w,A,L){
  const pl=w.places,s={home:0,sleep:0,travel:0,walk:0,cafe:0,workLocal:0,workOutside:0,shopLocal:0,shopOutside:0,eat:0,outsideOther:0,localOther:0};
  for(let a=0;a<A.n;a++){
    const act=L.act[a],p=L.at[a],out=p>=0&&pl.kind[p]===KIND.OUTSIDE;
    if(act===ACT.TRAVEL){if(L.mode[a]===MODE.WALK)s.walk++;else s.travel++}
    else if(act===ACT.SLEEP)s.sleep++;
    else if(act===ACT.WORK)out?s.workOutside++:s.workLocal++;
    else if(act===ACT.SHOP)out?s.shopOutside++:s.shopLocal++;
    else if(act===ACT.EAT){if(pl.kind[p]===KIND.CAFE)s.cafe++;else s.eat++}
    else if(p===A.home[a])s.home++;
    else if(out)s.outsideOther++;else s.localOther++;
  }
  return s;
}
// инварианты тика: каждый житель ровно в одном состоянии, места не переполнены
function checkInvariants(w,A,L){
  const pl=w.places,shop=new Int32Array(pl.n),work=new Int32Array(pl.n);
  for(let a=0;a<A.n;a++){
    const traveling=L.act[a]===ACT.TRAVEL;
    if(traveling!==(L.at[a]<0))throw new Error(`житель ${a}: в пути, но стоит на месте (или наоборот)`);
    if(L.act[a]===ACT.SLEEP&&L.at[a]!==A.home[a])throw new Error(`житель ${a} спит не дома`);
    if(L.act[a]===ACT.WORK){if(L.at[a]!==A.job[a])throw new Error(`житель ${a} работает не на своём месте`);work[L.at[a]]++}
    if(L.act[a]===ACT.SHOP||L.act[a]===ACT.EAT&&L.eatOut[a])shop[L.at[a]]++;
    if(L.eatOut[a]&&L.act[a]!==ACT.EAT)throw new Error(`житель ${a}: занимает место в кафе, но не ест`);
    if(L.food[a]<0)throw new Error(`житель ${a}: еды меньше нуля`);
  }
  for(let p=0;p<pl.n;p++){
    if(shop[p]!==L.shoppers[p]||work[p]!==L.workers[p])throw new Error(`место ${p}: счётчики разошлись`);
    if(shop[p]>pl.visitors[p])throw new Error(`место ${p}: посетителей больше мест`);
    if(work[p]>pl.jobs[p])throw new Error(`место ${p}: работников больше мест`);
  }
}

/*
 * Движение машин по дорогам (этап 4): каждая машина физически занимает место
 * на полосе, проезжает перекрёстки и паркуется на улице.
 *
 * Дороги. Каждое звено — две полосы: правая — от узла a к b, левая — обратно
 * (правостороннее движение). Полоса начинается и кончается у границы
 * перекрёстка (box — радиус R вокруг узла). Координата на полосе s — от её
 * начала до центра машины.
 *
 * Машины. Длина 4.5 м. Скорость меняется так, чтобы успеть остановиться
 * перед препятствием: передней машиной (с зазором), стоп-линией перекрёстка,
 * своим местом парковки. Разгон 2 м/с², торможение до 3 м/с², скорость до
 * cfg.speed.car. Обгонов и смены полос нет — на полосе машины идут по очереди.
 *
 * Короткое звено (на нём помещается не больше одной ждущей машины) — часть
 * перекрёстка: въехать на него можно, только если сразу можно проехать и
 * следующий перекрёсток; он бронируется заранее (цепочка), и связка
 * проходится без остановки. Иначе треугольник из коротких улиц запирается:
 * на каждой по машине, каждая ждёт следующую.
 * Объезд: машина ждёт у перекрёстка дольше rerouteAfter, потому что следующая
 * улица забита, — сворачивает туда, где есть место, и строит путь оттуда
 * (иначе кольцо забитых улиц запирается насовсем).
 * Перекрёстки (равнозначные, как в Европе без знаков):
 *   - на перекрёстке одновременно не больше одной машины;
 *   - въезжать можно, только если на полосе выезда есть место (перекрёсток
 *     не запирают);
 *   - помеха справа: уступает тот, у кого справа есть машина, которая тоже
 *     хочет и может проехать;
 *   - если уступают все (машины со всех сторон) — едет та, что дольше ждёт.
 * В тупике можно развернуться, в том числе у ворот, если ехать не в Город.
 *
 * Парковка. Вдоль улицы через каждые 5.5 м проверяется земля за бордюром:
 *   - свободна (нет зданий и других дорог, и путь заезда ничего не задевает)
 *     — место на земле: машина заезжает носом, перпендикулярно улице, а
 *     выезжает задним ходом; бордюр перед ним — въезд, там не стоят;
 *   - за бордюром здание — место вдоль бордюра (если улица достаточно широка,
 *     чтобы стоящая машина не задевала едущих: при 10 м — да, при 8 м — нет).
 * Машина поворачивает вокруг задней оси, как настоящая: корма не заносится.
 * Машина едет к ближайшему свободному месту у здания назначения (место
 * бронируется при выезде). Заезд и выезд — манёвры по кривой со скоростью
 * manSpeed; всё это время машина занимает полосу, едущие сзади ждут. Выезжает
 * с места, когда на полосе есть просвет.
 *
 * Внешний мир. У ворот машина уезжает с последней полосы и проводит за
 * воротами время пути по Городу (place.extra); обратно — появляется на
 * полосе от ворот, когда там есть место.
 *
 * Жизнь (life.mjs) раз в минуту создаёт поездки; движение считается шагами по
 * dt секунд и, когда машина приехала, ставит жителю тик прибытия (L.arrive).
 * Всё в массивах, порядок обхода фиксирован: детерминированно.
 */

const CAR={PARKED:0,MERGE:1,LANE:2,BOX:3,OUT:4,CITY:5,NONE:6,PARK_IN:7,PARK_OUT:8};
const CAR_NAME=['стоит','ждёт просвета, чтобы выехать','едет','на перекрёстке','за воротами','в Городе','нет машины','паркуется','выезжает с места'];
const NEVER=2147483647;

function createTraffic(w,A,L){
  const cfg=w.cfg.traffic,N=w.nodes.n,E=w.edges.n,R=cfg.box,len=cfg.carLength;
  const nx=w.nodes.x,ny=w.nodes.y,deg=new Int32Array(N),gateNode=new Uint8Array(N);
  for(let e=0;e<E;e++){deg[w.edges.a[e]]++;deg[w.edges.b[e]]++}
  for(let p=0;p<w.places.n;p++)if(w.places.kind[p]===KIND.OUTSIDE)gateNode[w.places.node[p]]=1;

  // ---- полосы ----
  const LN=2*E,lanes={n:LN,from:new Int32Array(LN),to:new Int32Array(LN),len:new Float64Array(LN),
    x0:new Float64Array(LN),y0:new Float64Array(LN),dx:new Float64Array(LN),dy:new Float64Array(LN),cars:[]};
  for(let l=0;l<LN;l++){const e=l>>1,fwd=(l&1)===0,f=fwd?w.edges.a[e]:w.edges.b[e],t=fwd?w.edges.b[e]:w.edges.a[e];
    const L0=Math.hypot(nx[t]-nx[f],ny[t]-ny[f]),dx=(nx[t]-nx[f])/L0,dy=(ny[t]-ny[f])/L0,rx=-dy,ry=dx;
    lanes.from[l]=f;lanes.to[l]=t;lanes.len[l]=Math.max(1,L0-2*R);lanes.dx[l]=dx;lanes.dy[l]=dy;
    lanes.x0[l]=nx[f]+dx*R+rx*cfg.laneOffset;lanes.y0[l]=ny[f]+dy*R+ry*cfg.laneOffset;lanes.cars.push([])}
  const reverse=(l)=>l^1;
  // зебры: у каждого конца звена, кроме ворот (туда пешком не ходят). Полоса держит свободными
  // свои первые / последние crossLen метров: машины ждут перед зеброй, пока по ней идут
  const CW=w.cfg.peds.crossLen,cwS=new Float64Array(LN),cwE=new Float64Array(LN);
  for(let l=0;l<LN;l++){cwS[l]=gateNode[lanes.from[l]]?0:CW;cwE[l]=gateNode[lanes.to[l]]?0:CW}
  // где машина ждёт перед перекрёстком (центр): до зебры, с зазором
  const stopS=(l)=>lanes.len[l]-cwE[l]-len/2-cfg.stopGap;
  const out=[...Array(N)].map(()=>[]),inn=[...Array(N)].map(()=>[]);
  for(let l=0;l<LN;l++){out[lanes.from[l]].push(l);inn[lanes.to[l]].push(l)}
  // переходы через перекрёсток: кривая (квадратичная Безье) от конца полосы к началу следующей
  const boxes=new Map();
  function lanePt(l,s){return [lanes.x0[l]+lanes.dx[l]*s,lanes.y0[l]+lanes.dy[l]*s]}
  // разворот — только в тупике; у ворот — только машине, которая стоит на полосе к ним (start)
  // и едет не в Город: использовать выезд как место для разворота посреди пути нельзя
  function allowed(li,lo,start){if(lanes.to[li]!==lanes.from[lo])return false;if(lo!==reverse(li))return true;
    const v=lanes.to[li];return deg[v]===1&&(!gateNode[v]||start===undefined||li===start)}
  function box(li,lo){
    const k=li*LN+lo;let b=boxes.get(k);if(b)return b;
    const v=lanes.to[li],P0=lanePt(li,lanes.len[li]),P1=lanePt(lo,0),d0=[lanes.dx[li],lanes.dy[li]],d1=[lanes.dx[lo],lanes.dy[lo]];
    const cr=d0[0]*d1[1]-d0[1]*d1[0];let C;
    if(lo===reverse(li))C=[nx[v]+d0[0]*R*1.3,ny[v]+d0[1]*R*1.3];                 // разворот
    else if(Math.abs(cr)<1e-3)C=[(P0[0]+P1[0])/2,(P0[1]+P1[1])/2];                // прямо
    else{const t=((P1[0]-P0[0])*d1[1]-(P1[1]-P0[1])*d1[0])/cr;C=[P0[0]+d0[0]*t,P0[1]+d0[1]*t]}
    const pts=[],cum=[0];for(let i=0;i<=12;i++){const t=i/12,u=1-t;pts.push([u*u*P0[0]+2*u*t*C[0]+t*t*P1[0],u*u*P0[1]+2*u*t*C[1]+t*t*P1[1]]);
      if(i)cum.push(cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]))}
    b={node:v,pts,cum,len:cum[12]};boxes.set(k,b);return b;
  }
  // ---- парковочные места ----
  const RW=w.roadHalfWidth,CURB=RW-w.sidewalk,clr=cfg.clearance;   // RW — до домов, CURB — край проезжей части
  // прямоугольник машины (с запасом) в точке P с курсом h
  function carRect(P,h,m){const c=Math.cos(h),s=Math.sin(h),hl=len/2+m,hw=0.95+m;return [[hl,hw],[hl,-hw],[-hl,-hw],[-hl,hw]].map(([x,y])=>[P[0]+x*c-y*s,P[1]+x*s+y*c])}
  function inPoly(P,poly){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[i],b=poly[j];if((a[1]>P[1])!==(b[1]>P[1])&&P[0]<(b[0]-a[0])*(P[1]-a[1])/(b[1]-a[1])+a[0])c=!c}return c}
  function segX(p,q,r,s){const d=(q[0]-p[0])*(s[1]-r[1])-(q[1]-p[1])*(s[0]-r[0]);if(Math.abs(d)<1e-12)return false;
    const t=((r[0]-p[0])*(s[1]-r[1])-(r[1]-p[1])*(s[0]-r[0]))/d,u=((r[0]-p[0])*(q[1]-p[1])-(r[1]-p[1])*(q[0]-p[0]))/d;return t>=0&&t<=1&&u>=0&&u<=1}
  function polysHit(A,B){if(A.some((p)=>inPoly(p,B))||B.some((p)=>inPoly(p,A)))return true;
    for(let i=0;i<A.length;i++)for(let j=0;j<B.length;j++)if(segX(A[i],A[(i+1)%A.length],B[j],B[(j+1)%B.length]))return true;return false}
  function segDist(P,a,b){const ab=[b[0]-a[0],b[1]-a[1]],l2=ab[0]*ab[0]+ab[1]*ab[1],t=l2?Math.max(0,Math.min(1,((P[0]-a[0])*ab[0]+(P[1]-a[1])*ab[1])/l2)):0;return Math.hypot(P[0]-a[0]-ab[0]*t,P[1]-a[1]-ab[1]*t)}
  // габариты контуров зданий — чтобы проверять только те, что рядом
  const obb=w.outlines.map((o)=>o.length>=3?bboxOf(o):null);
  function hitsBuildings(rect){const b=bboxOf(rect);for(let i=0;i<obb.length;i++){const o=obb[i];if(!o||o[0]>b[2]||o[2]<b[0]||o[1]>b[3]||o[3]<b[1])continue;if(polysHit(rect,w.outlines[i]))return true}return false}
  // прямоугольник не задевает здания и чужие дороги (своё звено — можно)
  function landFree(rect,ownEdge){
    if(hitsBuildings(rect))return false;
    for(let e=0;e<E;e++){if(e===ownEdge)continue;const a=[nx[w.edges.a[e]],ny[w.edges.a[e]]],b=[nx[w.edges.b[e]],ny[w.edges.b[e]]];
      if(rect.some((p)=>segDist(p,a,b)<RW))return false}
    for(let v=0;v<N;v++)if(rect.some((p)=>Math.hypot(p[0]-nx[v],p[1]-ny[v])<RW+0.5))return false;   // и не на перекрёстке
    return true;
  }
  // кубическая кривая [P0, C1, C2, P1]: курс в начале — к C1, в конце — от C2 (машина въезжает и встаёт ровно)
  function bez(c,t){const u=1-t,a=u*u*u,b=3*u*u*t,d=3*u*t*t,e=t*t*t;return [a*c[0][0]+b*c[1][0]+d*c[2][0]+e*c[3][0],a*c[0][1]+b*c[1][1]+d*c[2][1]+e*c[3][1]]}
  function bezDir(c,t){const u=1-t;return [3*u*u*(c[1][0]-c[0][0])+6*u*t*(c[2][0]-c[1][0])+3*t*t*(c[3][0]-c[2][0]),3*u*u*(c[1][1]-c[0][1])+6*u*t*(c[2][1]-c[1][1])+3*t*t*(c[3][1]-c[2][1])]}
  function bezLen(c){let L0=0,p=c[0];for(let i=1;i<=24;i++){const q=bez(c,i/24);L0+=Math.hypot(q[0]-p[0],q[1]-p[1]);p=q}return L0}
  const along=(P,d,k)=>[P[0]+d[0]*k,P[1]+d[1]*k];
  // kind: 0 — у бордюра, 1 — на земле. sStop — где на полосе начинается заезд, sOut — где кончается выезд.
  // in/out — кривые манёвров [P0, C, P1, длина, задним ходом]
  const slots={n:0,kind:[],lane:[],s:[],sStop:[],sOut:[],x:[],y:[],h:[],occ:[],pin:[],pout:[],wx:[],wy:[]};
  const lotRects=[],RA=cfg.rearAxle;
  // у бордюра — только если между стоящей и едущей машиной остаётся зазор (улица достаточно широкая)
  const parkC=CURB-0.95-cfg.curbGap,curbOK=parkC-0.95-(cfg.laneOffset+0.95)>=cfg.sideGap;
  // путь задней оси: из точки A0 с курсом d0 в A1 с курсом d1
  const axlePath=(C0,d0,C1,d1,k0,k1)=>{const A0=along(C0,d0,-RA),A1=along(C1,d1,-RA);return [A0,along(A0,d0,k0),along(A1,d1,-k1),A1]};
  // центр и курс машины в точке пути задней оси (back — задним ходом: машина смотрит против движения)
  function manPose(m,t){const B=bez(m.c,t),d=bezDir(m.c,Math.min(0.999,Math.max(0.001,t))),l0=Math.hypot(d[0],d[1])||1,f=m.back?-1:1,fx=f*d[0]/l0,fy=f*d[1]/l0;
    return {x:B[0]+fx*RA,y:B[1]+fy*RA,h:Math.atan2(fy,fx)}}
  for(let l=0;l<LN;l++){const e=l>>1,dx=lanes.dx[l],dy=lanes.dy[l],rx=-dy,ry=dx,hd=Math.atan2(dy,dx);
    for(let s=cfg.slotLength+1;s<=lanes.len[l]-cfg.slotLength/2-1;s+=cfg.slotLength){
      const P=lanePt(l,s),sStop=s-5,D=[dx,dy],Rn=[rx,ry];
      // место на земле за бордюром: носом от дороги
      const off=RW+cfg.lotDepthGap+len/2-cfg.laneOffset,Q=[P[0]+rx*off,P[1]+ry*off],hq=Math.atan2(ry,rx);
      // машина на месте и во время манёвров не заходит на зебры у концов полосы
      const lo0=Math.min(sStop,s)-len/2,hi0=s+cfg.slotLength+len/2;
      if(lo0<cwS[l]+0.2)continue;
      let lot=true;
      if(lot){const rect=carRect(Q,hq,clr);lot=landFree(rect,e)&&!lotRects.some((r)=>polysHit(r,rect));
        if(lot){const m={c:axlePath(lanePt(l,sStop),D,Q,Rn,2.5,3),back:0};for(let k=1;k<=40;k++){const ps=manPose(m,k/40);
          // весь путь заезда (и выезда задним ходом — тот же путь): только своя дорога и свободная земля
          const r2=carRect([ps.x,ps.y],ps.h,0.1);if(hitsBuildings(r2)){lot=false;break}}}
        if(lot)lotRects.push(rect)}
      if(lot&&s+len/2>lanes.len[l]-cwE[l]-0.2)lot=false;
      if(!lot&&(!curbOK||hi0>lanes.len[l]-cwE[l]-0.2))continue;   // узкая улица (или зебра): у бордюра не стоят
      const o=parkC-cfg.laneOffset,K=lot?Q:[P[0]+rx*o,P[1]+ry*o];
      let pin,pout;
      // пути манёвров: {c — кривая, len — длина, back — задним ходом}
      if(lot){const c=axlePath(lanePt(l,sStop),D,Q,Rn,2.5,3);pin={c,len:bezLen(c),back:0};pout={c:[c[3],c[2],c[1],c[0]],len:pin.len,back:1}} // выезд — задним ходом тем же путём
      // у бордюра — как настоящие водители: проезжает место, встаёт на корпус впереди и сдаёт назад; выезжает вперёд
      else{const ahead=lanePt(l,s+cfg.slotLength),A0=along(ahead,D,-RA),A1=along(K,D,-RA),ci=[A0,along(A0,D,-2.5),along(A1,D,2.5),A1],co=axlePath(K,D,ahead,D,2.5,2.5);
        pin={c:ci,len:bezLen(ci),back:1};pout={c:co,len:bezLen(co),back:0}}
      slots.kind.push(lot?1:0);slots.lane.push(l);slots.s.push(s);slots.sStop.push(lot?sStop:s+cfg.slotLength);slots.sOut.push(lot?sStop:s+cfg.slotLength);
      // точка, где путь заезда на землю пересекает тротуар (въезд)
      const wo=(CURB+RW)/2-cfg.laneOffset;slots.wx.push(P[0]+rx*wo);slots.wy.push(P[1]+ry*wo);
      slots.x.push(K[0]);slots.y.push(K[1]);slots.h.push(lot?hq:hd);slots.occ.push(-1);slots.pin.push(pin);slots.pout.push(pout);slots.n++}}

  // ---- места не мешают друг другу ----
  // у каждого места — что заметает машина при заезде и выезде (sweep) и где она стоит (park).
  // Места на земле берутся первыми, потом у бордюра; место остаётся, только если его манёвры
  // не задевают стоящие на соседних местах машины и наоборот. Соседние места, чьи манёвры
  // пересекаются (conf), одновременно не паркуются: второй ждёт.
  {
    const sw=[],pk=[],bb=[];
    for(let i=0;i<slots.n;i++){const r=[];for(const m of [slots.pin[i],slots.pout[i]])for(let k=0;k<=16;k++){const ps=manPose(m,k/16);r.push(carRect([ps.x,ps.y],ps.h,0.05))}
      sw.push(r);pk.push(carRect([slots.x[i],slots.y[i]],slots.h[i],0.05));bb.push(bboxOf([].concat(...r)))}
    const near=(i,j)=>!(bb[i][2]<bb[j][0]||bb[j][2]<bb[i][0]||bb[i][3]<bb[j][1]||bb[j][3]<bb[i][1]);
    const sweepHits=(i,rect)=>sw[i].some((r)=>polysHit(r,rect));
    // сетка 20 м: соседи места — только из своих и соседних ячеек
    const G=20,grid=new Map(),cellsOf=(i)=>{const out=[];for(let gx=Math.floor(bb[i][0]/G);gx<=Math.floor(bb[i][2]/G);gx++)for(let gy=Math.floor(bb[i][1]/G);gy<=Math.floor(bb[i][3]/G);gy++)out.push(gx+','+gy);return out};
    const neighbours=(i)=>{const s=new Set();for(const c of cellsOf(i))for(const j of grid.get(c)||[])if(j!==i&&near(i,j))s.add(j);return [...s].sort((x,y)=>x-y)};
    const order=[...Array(slots.n).keys()].sort((i,j)=>slots.kind[j]-slots.kind[i]||i-j),keep=[];
    for(const i of order){if(neighbours(i).every((j)=>!sweepHits(i,pk[j])&&!sweepHits(j,pk[i])&&!polysHit(pk[i],pk[j]))){keep.push(i);for(const c of cellsOf(i)){if(!grid.has(c))grid.set(c,[]);grid.get(c).push(i)}}}
    keep.sort((i,j)=>i-j);
    const idx=new Map(keep.map((i,jj)=>[i,jj]));
    const conf=keep.map((i)=>neighbours(i).filter((j)=>sw[i].some((r)=>sw[j].some((q)=>polysHit(r,q)))).map((j)=>idx.get(j)));
    for(const k of ['kind','lane','s','sStop','sOut','x','y','h','occ','pin','pout','wx','wy'])slots[k]=keep.map((i)=>slots[k][i]);
    slots.n=keep.length;slots.conf=conf;slots.man=new Int32Array(slots.n).fill(-1);
  }

    if(lanes.len[li]-cwE[li]<len+1){const o2=T.nodeOcc[lanes.from[li]];if(o2>=0&&T.route[o2]&&T.route[o2][T.ri[o2]+1]===li)return false}

/*
 * Пешеходы: жители, идущие пешком, физически идут по тротуарам и переходят
 * улицы по зебрам.
 *
 * Тротуары — по обе стороны каждого звена, между краем проезжей части и
 * домами (w.sidewalk метров; середина тротуара — в O от оси). Зебры — у
 * каждого конца звена, кроме ворот: поперёк улицы, сразу за границей
 * перекрёстка. Сеть для пешехода:
 *   точки — концы тротуаров у зебр (звено, конец, сторона);
 *   тротуар — вдоль звена между его зебрами;
 *   угол — с тротуара одной улицы на тротуар соседней, не переходя дорогу;
 *   зебра — через улицу (только когда можно, см. ниже).
 * Дверь дома — точка на тротуаре его улицы напротив фасада.
 *
 * Зебра. Пешеход ступает на неё, только если в её полосах нет машин, на неё
 * не едет машина с разрешением на перекрёсток и с перекрёстка на эту улицу
 * никто не съезжает. Пока по зебре идут, машины ждут перед ней и на
 * перекрёсток через неё не въезжают (traffic.mjs).
 * Въезды. Машина, заезжающая на место на земле или выезжающая с него,
 * пересекает тротуар: она ждёт, пока у въезда нет пешеходов, а пешеход ждёт,
 * пока она проедет.
 *
 * Пешеходы друг другу не мешают (тротуар 2 м, расходятся). Скорость —
 * cfg.speed.walk. Всё в массивах, порядок обхода фиксирован.
 */

// BEYOND — за выездом, в Городе (идёт или едет на транспорте; на карте не виден)
const PED={NONE:0,WALK:1,WAIT:2,CROSS:3,CAR_WAIT:4,BEYOND:5};

// двоичная куча для Дейкстры: [стоимость, номер]
function minHeap(){const c=[],v=[];
  return {get size(){return c.length},
    push(cost,id){let i=c.length;c.push(cost);v.push(id);while(i>0){const p=(i-1)>>1;if(c[p]<=cost)break;c[i]=c[p];v[i]=v[p];i=p}c[i]=cost;v[i]=id},
    pop(){const top=v[0],tc=c[0],lc=c.pop(),lv=v.pop();if(c.length){let i=0;for(;;){let l=2*i+1,r=l+1,m=i,mc=lc;
      if(l<c.length&&c[l]<mc){m=l;mc=c[l]}if(r<c.length&&c[r]<mc){m=r;mc=c[r]}if(m===i)break;c[i]=c[m];v[i]=v[m];i=m}c[i]=lc;v[i]=lv}return [tc,top]}}}

function createPeds(w,A,L,T){
  const cfg=w.cfg.peds,N=w.nodes.n,E=w.edges.n,nx=w.nodes.x,ny=w.nodes.y;
  const RW=w.roadHalfWidth,SW=w.sidewalk,CURB=RW-SW,O=SW>0?CURB+SW/2:RW+0.6,D=w.cfg.traffic.box+cfg.crossAt;
  const ea=w.edges.a,eb=w.edges.b,el=w.edges.len,gate=T.gateNode;
  const dirAB=(e)=>{const l=el[e];return [(nx[eb[e]]-nx[ea[e]])/l,(ny[eb[e]]-ny[ea[e]])/l]};

  const pid=(e,end,side)=>e*4+end*2+(side>0?0:1);

    for(const end of [0,1])for(const side of [1,-1]){const v=end?eb[e]:ea[e],u=end?-1:1;P[pid(e,end,side)]=[nx[v]+d[0]*u*D+n[0]*side*O,ny[v]+d[1]*u*D+n[1]*side*O]}}

  // зебры: номер = e*2 + конец

    link(pid(e,end,1),pid(e,end,-1),dist(P[pid(e,end,1)],P[pid(e,end,-1)]),[],e*2+end)}
  // углы: между соседними (по кругу) улицами узла — по тротуару, через угловую точку

    const inc=[];for(let e=0;e<E;e++){if(ea[e]===v){const d=dirAB(e);inc.push({e,end:0,r:d})}if(eb[e]===v){const d=dirAB(e);inc.push({e,end:1,r:[-d[0],-d[1]]})}}

    inc.forEach((x)=>x.ang=Math.atan2(x.r[1],x.r[0]));inc.sort((x,y)=>x.ang-y.ang);

    const sideRel=(x,s)=>x.end===0?s:-s;
    for(let i=0;i<inc.length;i++){const x=inc[i],y=inc[(i+1)%inc.length];let phi=y.ang-x.ang;if(phi<=1e-9)phi+=2*Math.PI;
      const a=pid(x.e,x.end,sideRel(x,1)),b=pid(y.e,y.end,sideRel(y,-1));let via=[];
      if(phi<Math.PI*0.95){const m=[x.r[0]+y.r[0],x.r[1]+y.r[1]],ml=Math.hypot(m[0],m[1]),k=O/Math.sin(phi/2);via=[[nx[v]+m[0]/ml*k,ny[v]+m[1]/ml*k]]}
      const pts=[P[a],...via,P[b]];let L0=0;for(let j=1;j<pts.length;j++)L0+=dist(pts[j-1],pts[j]);link(a,b,L0,via,-1)}}

  // двери: место p — на тротуаре своей улицы напротив фасада (звено, сторона, расстояние от a)
  const door=new Array(w.places.n).fill(null);
  for(let p=0;p<w.places.n;p++){
    // Город за выездом: дверь — конец тротуара у выезда
    if(w.places.kind[p]===KIND.OUTSIDE){const v=w.places.node[p];let e=-1;for(let k=0;k<E;k++)if(ea[k]===v||eb[k]===v){e=k;break}if(e<0)continue;
      const d=dirAB(e),n=[-d[1],d[0]],u=ea[e]===v?Math.min(D,el[e]/2):Math.max(el[e]-D,el[e]/2);door[p]={e,side:1,u,x:nx[ea[e]]+d[0]*u+n[0]*O,y:ny[ea[e]]+d[1]*u+n[1]*O};continue}
    if(w.places.edge[p]<0)continue;const e=w.places.edge[p],d=dirAB(e),n=[-d[1],d[0]];
    const ax=nx[ea[e]]+d[0]*w.places.t[p]*el[e],ay=ny[ea[e]]+d[1]*w.places.t[p]*el[e],side=((w.places.x[p]-ax)*n[0]+(w.places.y[p]-ay)*n[1])>=0?1:-1;
    const u=Math.max(D,Math.min(el[e]-D,w.places.t[p]*el[e]));door[p]={e,side,u,x:nx[ea[e]]+d[0]*u+n[0]*side*O,y:ny[ea[e]]+d[1]*u+n[1]*side*O}}

  // маршрут от двери до двери: [{x, y, cross}] — cross ≥ 0 у отрезка, идущего по зебре
  function route(p,q){
    const s=door[p],t=door[q];if(!s||!t)return null;
    if(s.e===t.e&&s.side===t.side)return {len:Math.abs(s.u-t.u),pts:[{x:s.x,y:s.y,cross:-1},{x:t.x,y:t.y,cross:-1}]};
    const M=4*E,dd=new Float64Array(M).fill(Infinity),prev=new Int32Array(M).fill(-1),pl=new Array(M).fill(null),done=new Uint8Array(M),H=minHeap();
    const s0=pid(s.e,0,s.side),s1=pid(s.e,1,s.side);dd[s0]=Math.max(0,s.u-D);dd[s1]=Math.max(0,el[s.e]-D-s.u);H.push(dd[s0],s0);H.push(dd[s1],s1);
    const goal=new Map([[pid(t.e,0,t.side),Math.max(0,t.u-D)],[pid(t.e,1,t.side),Math.max(0,el[t.e]-D-t.u)]]);let best=Infinity,bestEnd=-1;
    while(H.size){const [du,u]=H.pop();if(done[u]||du>dd[u])continue;
      if(du>=best)break;done[u]=1;if(goal.has(u)&&du+goal.get(u)<best){best=du+goal.get(u);bestEnd=u}
      for(const k of adj[u]){const c=du+k.len;if(!done[k.to]&&c<dd[k.to]){dd[k.to]=c;prev[k.to]=u;pl[k.to]=k;H.push(c,k.to)}}}
    if(bestEnd<0)return null;
    const chain=[];let x=bestEnd;while(prev[x]>=0){chain.push(pl[x]);x=prev[x]}chain.reverse();
    const pts=[{x:s.x,y:s.y,cross:-1},{x:P[x][0],y:P[x][1],cross:-1}];
    for(const k of chain){for(const v of k.via)pts.push({x:v[0],y:v[1],cross:-1});pts.push({x:P[k.to][0],y:P[k.to][1],cross:k.cross})}
    pts.push({x:t.x,y:t.y,cross:-1});

  }
  // длина пешего пути: расстояния от каждой точки сети считаются один раз (Дейкстра от точки), дальше — сложение
  const rows=new Map();
  function row(src){let r=rows.get(src);if(r)return r;const M=4*E;r=new Float64Array(M).fill(Infinity);const H=minHeap();r[src]=0;H.push(0,src);
    while(H.size){const [du,u]=H.pop();if(du>r[u])continue;for(const k of adj[u]){const c=du+k.len;if(c<r[k.to]){r[k.to]=c;H.push(c,k.to)}}}rows.set(src,r);return r}
  function walkDist(p,q){if(p===q)return 0;const s=door[p],t=door[q];if(!s||!t)return Infinity;
    if(s.e===t.e&&s.side===t.side)return Math.abs(s.u-t.u);
    let best=Infinity;for(const [se,sc] of [[0,Math.max(0,s.u-D)],[1,Math.max(0,el[s.e]-D-s.u)]]){const r=row(pid(s.e,se,s.side));
      for(const [te,tc] of [[0,Math.max(0,t.u-D)],[1,Math.max(0,el[t.e]-D-t.u)]]){const v=sc+r[pid(t.e,te,t.side)]+tc;if(v<best)best=v}}
    return best}

  const n=A.n,S={door,P,adj,route,walkDist,O,D,
    state:new Uint8Array(n),path:new Array(n).fill(null),wi:new Int32Array(n),x:new Float64Array(n),y:new Float64Array(n),hx:new Float64Array(n),hy:new Float64Array(n).fill(1),
    crossN:new Int32Array(2*E),crossId:new Int32Array(n).fill(-1),start:new Float64Array(n),
    active:[],outT:new Float64Array(n),toOut:new Uint8Array(n),   // идущие сейчас; время за выездом; идёт в Город
    stats:{walks:0,arrivals:0,crossings:0,crossWaits:0,drivewayWaits:0,maxWalkSec:0},
    rlen:new Float64Array(n),log:[]};   // log: [житель, длина пути м, секунд в пути] — для проверок скорости

  // из Города — сначала время за выездом, потом от выезда пешком; в Город — пешком до выезда, потом время за ним
  S.startWalk=function(a,from,to){
    const pl=w.places,r=route(from,to);if(!r)throw new Error(`пешком не дойти: житель ${a}, места ${from} → ${to}`);
    S.path[a]=r.pts;S.wi[a]=1;S.rlen[a]=r.len;S.x[a]=r.pts[0].x;S.y[a]=r.pts[0].y;S.start[a]=T.time;S.stats.walks++;S.active.push(a);

  T.crossBusy=(v,e)=>S.crossN[e*2+(ea[e]===v?0:1)]>0;
  // пешеходы рядом с точкой: сетка 10 м, собирается заново, когда время сдвинулось
  let gridAt=-1,grid=new Map();const GC=10;
  T.pedsNear=(x,y,r)=>{
    if(gridAt!==T.time){gridAt=T.time;grid=new Map();for(const a of S.active){if(S.state[a]===PED.BEYOND)continue;const k=Math.floor(S.x[a]/GC)+','+Math.floor(S.y[a]/GC);let c=grid.get(k);if(!c)grid.set(k,c=[]);c.push(a)}}
    for(let gx=Math.floor((x-r)/GC);gx<=Math.floor((x+r)/GC);gx++)for(let gy=Math.floor((y-r)/GC);gy<=Math.floor((y+r)/GC);gy++)
      for(const a of grid.get(gx+','+gy)||[])if(Math.hypot(S.x[a]-x,S.y[a]-y)<r)return true;
    return false};
  function arrive(a){S.state[a]=PED.NONE;S.path[a]=null;L.arrive[a]=L.tick;S.stats.arrivals++;S.stats.maxWalkSec=Math.max(S.stats.maxWalkSec,T.time-S.start[a]);S.log.push([a,S.rlen[a],T.time-S.start[a]])}

  S.step=function(dt){
    const v0=w.cfg.speed.walk;
    let done=false;
    for(const a of S.active){const st=S.state[a];if(st===PED.NONE)continue;
      if(st===PED.BEYOND){S.outT[a]-=dt;if(S.outT[a]>0)continue;
        if(S.wi[a]>=S.path[a].length){arrive(a);done=true;continue}   // доехал до места в Городе
        S.state[a]=PED.WALK}                                          // вернулся к выезду — дальше пешком

          S.state[a]=PED.CROSS;S.crossId[a]=nxt.cross;S.crossN[nxt.cross]++;S.stats.crossings++}
        const dx=nxt.x-S.x[a],dy=nxt.y-S.y[a],d=Math.hypot(dx,dy);
        if(d>1e-9){S.hx[a]=dx/d;S.hy[a]=dy/d}
        const step=Math.min(left,d),X=S.x[a]+S.hx[a]*step,Y=S.y[a]+S.hy[a]*step;
        // въезд: машина пересекает тротуар — подождать
        if(S.state[a]!==PED.CROSS&&step>0&&T.carsNear(X,Y,0.6)){if(S.state[a]!==PED.CAR_WAIT)S.stats.drivewayWaits++;S.state[a]=PED.CAR_WAIT;break}
        if(S.state[a]===PED.CAR_WAIT||S.state[a]===PED.WAIT)S.state[a]=PED.WALK;
        S.x[a]=X;S.y[a]=Y;left-=step;
        if(step>=d-1e-9){
          if(S.state[a]===PED.CROSS&&nxt.cross>=0){S.crossN[nxt.cross]--;S.crossId[a]=-1;S.state[a]=PED.WALK}
          S.wi[a]++;
          if(S.wi[a]>=pts.length){if(S.toOut[a]){S.state[a]=PED.BEYOND;S.outT[a]=w.places.extra[L.to[a]];break}arrive(a);done=true;break}
        }

    }

// Сборка симуляции из снимка и настроек. Без графики и без DOM.

function createSim(snapshot,cfg={}){
  const c=withDefaults(cfg),rng=makeRng(c.seed);
  const world=buildWorld(snapshot,c);
  const agents=createPopulation(world,rng);
  const life=createLife(world,agents,rng);
  const traffic=c.traffic.on?createTraffic(world,agents,life):null;
  const peds=traffic?createPeds(world,agents,life,traffic):null;
  if(peds)life.walkDist=peds.walkDist;
  return {cfg:c,rng,world,agents,life,traffic,peds,sub:0,carry:0};
}
/*
 * Время идёт шагами движения по dt секунд (0.5 с); в начале каждой игровой
 * минуты — шаг жизни (решения жителей). Пока машин в пути нет, шаги движения
 * пропускаются до следующей минуты — это ничего не меняет, но быстро.
 */
function subPerTick(sim){return Math.round(sim.cfg.tickSeconds/(sim.traffic?sim.cfg.traffic.dt:sim.cfg.tickSeconds))}
function subStep(sim,{check,onTick}){
  const per=subPerTick(sim),T=sim.traffic;
  if(sim.sub%per===0){
    step(sim.world,sim.agents,sim.life);
    if(T)for(const a of sim.life.trips.splice(0)){const L=sim.life;
      if(L.mode[a]===MODE.CAR)T.startTrip(a,L.from[a],L.to[a]);else sim.peds.startWalk(a,L.from[a],L.to[a])}
    if(check)checkInvariants(sim.world,sim.agents,sim.life);
    if(onTick)onTick(sim);
  }
  if(T){const k=Math.max(1,Math.round(sim.cfg.peds.dt/sim.cfg.traffic.dt));
    T.step(sim.cfg.traffic.dt);if(sim.sub%k===k-1)sim.peds.step(k*sim.cfg.traffic.dt);   // пешеходы — шагом peds.dt
    if(check){T.check();sim.peds.check()}}
  sim.sub++;
}
// прожить sec игровых секунд (можно дробно — остаток копится)
function advanceSeconds(sim,sec,opts={}){
  const dt=sim.traffic?sim.cfg.traffic.dt:sim.cfg.tickSeconds,per=subPerTick(sim);
  sim.carry+=sec;
  while(sim.carry>=dt-1e-9){
    if(sim.traffic&&sim.sub%per!==0&&!sim.traffic.busy()&&!sim.peds.busy()&&sim.carry>=(per-sim.sub%per)*dt){ // пусто — сразу к следующей минуте
      const k=per-sim.sub%per;sim.traffic.time+=k*dt;sim.sub+=k;sim.carry-=k*dt;continue}
    subStep(sim,opts);sim.carry-=dt;
  }
}
// прожить ticks игровых минут; onTick(sim) — после шага жизни каждой минуты
function advance(sim,ticks,opts={}){advanceSeconds(sim,ticks*sim.cfg.tickSeconds,opts)}
// игровое время, секунды
const simSeconds=(sim)=>sim.traffic?sim.sub*sim.cfg.traffic.dt:sim.sub*sim.cfg.tickSeconds;
const ticksPerDay=(sim)=>Math.round(86400/sim.cfg.tickSeconds);

function hourly(){

  L.forEach(function(l){var b=l.b;if(b.z==='pump'&&b.dirty)dirtyNet[b.comp]=1});
  L.forEach(function(l){var b=l.b;b.dirtyW=!!dirtyNet[b.comp]&&zoneType(b.z)==='res';
    if(!done(b)||b.aband)return;var t=zoneType(b.z);

  var employed=Math.min(workers,J),outCap=linked?Math.round(30+0.15*workers):0,outJobs=Math.min(workers-employed,outCap),unemployed=workers-employed-outJobs;
  var st={pop:pop,jobs:jobs,J:J,workers:workers,employed:employed,outJobs:outJobs,unemployed:unemployed,fill:fill,nets:nets};
  // спрос

  var hap=0,hn=0;L.forEach(function(l){if(zoneType(l.b.z)==='res'&&done(l.b)&&!l.b.aband){l.b.hap=happiness(l);hap+=l.b.hap;hn++}else if(isZoneB(l.b)&&done(l.b))l.b.hap=happiness(l)});
  st.hap=hn?hap/hn:60;
  var bad=L.filter(function(l){return done(l.b)&&isZoneB(l.b)&&(!l.b.pow||!l.b.wat||!l.b.sew)}).length/Math.max(1,L.filter(function(l){return isZoneB(l.b)}).length);
  var raw={
    r:35+130*vac-160*un+(st.hap-55)*0.6-5*(S.tax.r-TAX0)-60*bad,

      else if(S.t-b.aband>3*DAY){E.lots=E.lots.filter(function(x){return x!==l});changed=true;dirtySim=true;log('Снесён заброшенный дом')}return}
    if(!ok||b.hap<20){b.badH=(b.badH||0)+1;if(b.badH>=(ok?72:36)){b.aband=S.t;b.occ=0;b.badH=0;changed=true;dirtySim=true;log((ok?'Жильцы уехали: несчастны — ':'Дом заброшен: ')+(b.why||[]).slice(0,2).join(', '))}}else b.badH=0;

  });
  // рост: новые дома на свободных клетках зон
  var occ=null;
  ZKEYS.forEach(function(z){var d=z==='h'?S.demand.r:S.demand[z];if(d<=4||S.stats.pop<ZONE[z].unlock&&z!=='r'&&z!=='c'&&z!=='i')return;
    var n=rng()*100<d?1+(d>45?1:0)+(d>75?1:0):0;for(var i=0;i<n;i++){occ=occ||occupied();if(grow(z,occ))changed=true}});

  E.exits.forEach(function(x){if(E.exitValid(x))linked[comp(x.node)]=1});
  Object.keys(E.G.hs).forEach(function(key){var Sd=E.G.hs[key],seg=+key.split(':')[0];if(!E.segs[seg]||!linked[comp(E.segs[seg].a)])return;

  if(S.money<D.cost)return 'не хватает денег';return null}
function placeAt(P,commit){var D=BLD[place],l=placeLot(P);if(!l){$('prev').innerHTML='';return}
  var why=placeWhy(l);
  if(!commit){$('prev').innerHTML=E.lotSvg(l,why?'#D9363E':'#3E9B5B',why?'#8E1B21':'#1F6B38',0.55,1.6);$('hint').textContent=D.name+': '+(why?'нельзя — '+why:'можно, '+fmt(D.cost)+' $');return}
  if(why){toast(D.name+': '+why,'bad');return}
  if(!spend(D.cost,'build'))return;
  l.type='work';l.color=D.color;l.floors=Math.max(1,D.fl);l.b={z:place,lv:1,born:S.t,done:S.t+2*HOUR,occ:0};l.cap=D.jobs;
  E.lots.push(l);$("prev").innerHTML="";dirtySim=true;E.drawLots();dirty3D=true;toast('Строится: '+D.name);hourlySoon();ui()}
