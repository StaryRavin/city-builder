<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Городок у реки</title>
<style>
  :root { color-scheme: light dark; --bg:#fafaf7; --panel:#ffffff; --fg:#1d1d1b; --muted:#6a6a64; --btn:#ecebe4; --btn-b:#cfcdc2; --on:#2f6f8f; --on-fg:#fff; --bad:#c62f36; --good:#2e7d4a; --line:#dedbd0; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#1b1b19; --panel:#24241f; --fg:#ecece6; --muted:#9a9a92; --btn:#2e2e2a; --btn-b:#46463f; --on:#4b93b8; --on-fg:#0d1418; --bad:#ff6b6b; --good:#6fcf8f; --line:#3a3a34; } }
  :root[data-theme="dark"] { --bg:#1b1b19; --panel:#24241f; --fg:#ecece6; --muted:#9a9a92; --btn:#2e2e2a; --btn-b:#46463f; --on:#4b93b8; --on-fg:#0d1418; --bad:#ff6b6b; --good:#6fcf8f; --line:#3a3a34; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--fg); font:14px/1.4 system-ui, sans-serif; display:flex; flex-direction:column; overflow:hidden; }
  button { font:inherit; font-size:13px; color:var(--fg); background:var(--btn); border:1px solid var(--btn-b); border-radius:6px; padding:4px 10px; cursor:pointer; white-space:nowrap; }
  button[aria-pressed="true"] { background:var(--on); color:var(--on-fg); border-color:var(--on); }
  button:disabled { opacity:.45; cursor:default; }
  .bad { color:var(--bad); } .good { color:var(--good); } .muted { color:var(--muted); font-size:12px; }
  #top { flex:none; display:flex; flex-wrap:wrap; align-items:center; gap:6px 16px; padding:8px 12px; border-bottom:1px solid var(--line); background:var(--panel); }
  .stat { display:flex; flex-direction:column; line-height:1.15; }
  .stat small { color:var(--muted); font-size:11px; }
  .stat b { font-size:15px; font-variant-numeric:tabular-nums; }
  #net { font-size:11px; font-variant-numeric:tabular-nums; }
  .rci { display:flex; gap:3px; align-items:flex-end; height:34px; }
  .rci div { width:14px; height:100%; background:var(--btn); border-radius:3px; position:relative; display:flex; align-items:flex-end; }
  .rci div i { display:block; width:100%; border-radius:3px; }
  .rci div span { position:absolute; bottom:-14px; left:0; right:0; text-align:center; font-size:10px; color:var(--muted); }
  .util { font-size:12px; font-variant-numeric:tabular-nums; line-height:1.3; }
  .util span.k { color:var(--muted); display:inline-block; width:44px; }
  .grp { display:flex; }
  .grp button { border-radius:0; margin-left:-1px; }
  .grp button:first-child { border-radius:6px 0 0 6px; margin-left:0; }
  .grp button:last-child { border-radius:0 6px 6px 0; }
  .sp { flex:1; }
  #main { flex:1; display:flex; min-height:0; }
  #tools { width:220px; overflow-y:auto; padding:8px; border-right:1px solid var(--line); background:var(--panel); }
  .tg { margin-bottom:10px; }
  .tgh { font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:0 0 4px 2px; }
  .tgb { display:flex; flex-wrap:wrap; gap:4px; }
  .tgb button { display:flex; align-items:center; gap:5px; padding:4px 8px; }
  .tgb button i { display:inline-block; width:10px; height:10px; border-radius:2px; border:1px solid rgba(0,0,0,.3); flex:none; }
  .tgb button small { opacity:.7; font-size:11px; }
  #stage { flex:1; position:relative; min-width:0; overflow:hidden; background:#CFC8B2; }
  #sv { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; user-select:none; -webkit-user-select:none; }
  .ns { vector-effect:non-scaling-stroke; }
  #v3d { position:absolute; inset:0; touch-action:none; background:#dfe7ea; }
  #v3d canvas { display:block; width:100% !important; height:100% !important; }
  #v3d[hidden], .grp[hidden] { display:none; }
  .float { position:absolute; display:flex; gap:6px; flex-wrap:wrap; }
  #f-tl { top:8px; left:8px; }
  #f-tr { top:8px; right:8px; }
  .float button { box-shadow:0 1px 3px rgba(0,0,0,.12); }
  #info { position:absolute; left:8px; bottom:8px; max-width:340px; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 30px 10px 12px; box-shadow:0 4px 16px rgba(0,0,0,.15); font-size:13px; }
  #info div { margin:2px 0; }
  #info-x { position:absolute; top:4px; right:4px; padding:0 7px; border:none; background:none; font-size:18px; }
  #info[hidden], #budget[hidden], #toast[hidden] { display:none; }
  #budget { position:absolute; right:8px; top:48px; width:330px; max-width:calc(100% - 16px); background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; box-shadow:0 4px 16px rgba(0,0,0,.18); }
  #budget h2 { font-size:15px; margin:0 0 6px; }
  #budget table { width:100%; border-collapse:collapse; font-size:13px; }
  #budget th { text-align:left; padding:8px 0 2px; border-bottom:1px solid var(--line); }
  #budget td { padding:3px 0; } .num { text-align:right; font-variant-numeric:tabular-nums; }
  .tax { display:block; font-size:12px; color:var(--muted); }
  .tax input { width:110px; vertical-align:middle; }
  #bud-x { position:absolute; top:6px; right:6px; border:none; background:none; font-size:18px; padding:0 7px; }
  #toast { position:absolute; left:50%; top:10px; transform:translateX(-50%); background:var(--panel); border:1px solid var(--line); border-left:4px solid var(--on); border-radius:8px; padding:8px 14px; box-shadow:0 4px 16px rgba(0,0,0,.18); max-width:min(520px, calc(100% - 24px)); font-size:13px; z-index:5; }
  #toast.bad { border-left-color:var(--bad); } #toast.good { border-left-color:var(--good); }
  #bottom { display:flex; gap:12px; align-items:center; padding:0 12px; border-top:1px solid var(--line); background:var(--panel); height:36px; flex:none; overflow:hidden; }
  #hint { color:var(--muted); font-size:12px; margin:0; flex:1; min-width:0; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; line-height:1.3; }
  #st { font-size:12px; margin:0; color:var(--muted); max-width:34%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #stats { display:none; }
  .legend { display:flex; gap:10px; font-size:11px; color:var(--muted); }
  .legend i { display:inline-block; width:9px; height:9px; border-radius:50%; vertical-align:-1px; margin-right:3px; border:1px solid #fff; }
  @media (max-width: 760px) {
    #main { flex-direction:column-reverse; }
    #tools { width:auto; border-right:none; border-top:1px solid var(--line); max-height:none; overflow-x:auto; overflow-y:hidden; display:flex; gap:10px; padding:6px 8px; }
    .tg { margin:0; flex:none; } .tgb { flex-wrap:nowrap; }
    #top { gap:4px 10px; padding:6px 8px; } .util, .legend { display:none; }
    #info { right:8px; max-width:none; }
  }
</style>
</head>
<body>
<header id="top">
  <div class="stat"><small>Казна</small><b id="money">—</b><span id="net"></span></div>
  <div class="stat"><small>Жители</small><b id="pop">0</b></div>
  <div class="stat"><small>Рабочие места</small><b id="jobs">0</b></div>
  <div class="stat"><small>Безработица</small><b id="unemp">—</b></div>
  <div class="rci" title="Спрос на зоны">
    <div><i id="d-r" style="background:#3F8F4E"></i><span>Ж</span></div>
    <div><i id="d-c" style="background:#3D7DC8"></i><span>Т</span></div>
    <div><i id="d-i" style="background:#D49A22"></i><span>П</span></div>
    <div><i id="d-o" style="background:#8A5CC4"></i><span>О</span></div>
  </div>
  <div class="util"><div><span class="k">Свет</span><span id="u-p">—</span></div><div><span class="k">Вода</span><span id="u-w">—</span></div><div><span class="k">Стоки</span><span id="u-s">—</span></div></div>
  <span class="sp"></span>
  <div class="stat"><small id="mile"></small><b id="clock">—</b></div>
  <div class="grp" role="group" aria-label="Скорость">
    <button type="button" data-speed="0" aria-label="Пауза">❚❚</button>
    <button type="button" data-speed="1" aria-label="Скорость 1">▶</button>
    <button type="button" data-speed="2" aria-label="Скорость 2">▶▶</button>
    <button type="button" data-speed="3" aria-label="Скорость 3">▶▶▶</button>
  </div>
  <button type="button" id="b-budget">Бюджет</button>
  <button type="button" id="b-new">Новый город</button>
</header>
<div id="main">
  <aside id="tools" aria-label="Инструменты"></aside>
  <div id="stage">
    <svg id="sv" viewBox="0 0 800 500" role="img" aria-label="Карта города">
      <g id="world"><g id="terrain"></g><g id="cells"></g><g id="ghost"></g><g id="roads"></g><g id="lots"></g><g id="agents"></g><g id="nodes"></g><g id="exits"></g><g id="prev"></g></g>
    </svg>
    <div id="v3d" hidden></div>
    <div class="float" id="f-tl">
      <div class="grp" role="group" aria-label="Слои">
        <button type="button" data-ovl="none" aria-pressed="true">Обычный</button>
        <button type="button" data-ovl="power" aria-pressed="false">Свет</button>
        <button type="button" data-ovl="water" aria-pressed="false">Вода</button>
        <button type="button" data-ovl="happy" aria-pressed="false">Счастье</button>
        <button type="button" data-ovl="svc" aria-pressed="false">Услуги</button>
      </div>
    </div>
    <div class="float" id="f-tr">
      <div class="grp" role="group" aria-label="Масштаб">
        <button id="z-out" type="button" aria-label="Отдалить">−</button>
        <button id="z-in" type="button" aria-label="Приблизить">+</button>
      </div>
      <button id="b-3d" type="button" aria-pressed="false">3D</button>
      <div class="grp" id="g3d" role="group" aria-label="Поворот и наклон" hidden>
        <button id="r-l" type="button" aria-label="Повернуть влево">⟲</button>
        <button id="r-r" type="button" aria-label="Повернуть вправо">⟳</button>
        <button id="t-tilt" type="button">Наклон 60°</button>
      </div>
      <button id="b-life" type="button" aria-pressed="true" title="Жители и машины на улицах">Жизнь</button>
    </div>
    <div id="info" hidden></div>
    <div id="budget" hidden><h2>Бюджет</h2><button type="button" id="bud-x" aria-label="Закрыть">×</button><div id="bud-body"></div></div>
    <div id="toast" hidden></div>
  </div>
</div>
<footer id="bottom">
  <p id="hint"></p>
  <div class="legend"><span><i style="background:#F2C230"></i>нет света</span><span><i style="background:#3C8DD0"></i>нет воды</span><span><i style="background:#8C7A5B"></i>нет стоков</span><span><i style="background:#D9363E"></i>нет дороги к выезду</span></div>
  <p id="st"></p><p id="stats"></p>
</footer>
<script>/*@CITY3D@*/</script>
<script>/*@SIM@*/</script>
<script>/*@GAME@*/</script>
<script>/*@EDITOR@*/</script>
</body>
</html>
